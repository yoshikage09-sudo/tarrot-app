<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f">

<title>アストラルライブラリー｜ワンオラクル</title>

<style>
:root{
  --night:#040914;
  --night2:#071321;
  --navy:#0b1d32;
  --navy2:#102b46;

  --gold:#d7b86b;
  --gold-bright:#f7e3a1;

  --ivory:#fff8e7;
  --text:#e7edf5;
  --muted:#adb9c9;

  --violet:#8d79cb;
  --blue:#5c92c7;
}

/* --------------------------------------------------
   BASE
-------------------------------------------------- */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  background:#020610;
  color:var(--text);
  font-family:
    "Hiragino Sans",
    "Yu Gothic",
    "YuGothic",
    system-ui,
    -apple-system,
    sans-serif;

  overflow-x:hidden;
}

a{
  color:inherit;
}

button{
  font:inherit;
}

/* --------------------------------------------------
   MAIN SCENE
-------------------------------------------------- */

.astral-scene{
  position:relative;
  min-height:100vh;
  overflow:hidden;
  isolation:isolate;

  background:
    radial-gradient(
      circle at 50% 14%,
      rgba(104,135,194,.22),
      transparent 24%
    ),

    radial-gradient(
      ellipse at 48% 63%,
      rgba(89,74,159,.22),
      transparent 30%
    ),

    radial-gradient(
      ellipse at 65% 72%,
      rgba(41,100,150,.13),
      transparent 32%
    ),

    linear-gradient(
      180deg,
      #0b1727 0%,
      #071321 38%,
      #040a13 74%,
      #02050c 100%
    );
}

/* vignette */

.astral-scene::after{
  content:"";
  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.68),
      transparent 21%,
      transparent 79%,
      rgba(0,0,0,.68)
    ),

    linear-gradient(
      180deg,
      rgba(0,0,0,.08),
      transparent 55%,
      rgba(0,0,0,.52)
    );

  z-index:40;
}

/* --------------------------------------------------
   STARS
-------------------------------------------------- */

.starfield{
  position:absolute;
  inset:0;

  z-index:-10;

  background-image:

    radial-gradient(circle at 8% 9%, #fff 0 1px, transparent 1.4px),
    radial-gradient(circle at 17% 20%, #ffe8a8 0 1px, transparent 1.4px),
    radial-gradient(circle at 27% 8%, #fff 0 1px, transparent 1.3px),
    radial-gradient(circle at 39% 23%, #cbdcff 0 1px, transparent 1.5px),

    radial-gradient(circle at 49% 12%, #fff 0 1.2px, transparent 1.6px),
    radial-gradient(circle at 59% 27%, #e9dcff 0 1px, transparent 1.5px),
    radial-gradient(circle at 67% 8%, #fff8d6 0 1px, transparent 1.5px),
    radial-gradient(circle at 78% 21%, #fff 0 1px, transparent 1.5px),

    radial-gradient(circle at 91% 13%, #dccbff 0 1px, transparent 1.4px),
    radial-gradient(circle at 13% 47%, #fff 0 1px, transparent 1.4px),
    radial-gradient(circle at 24% 63%, #dbeaff 0 1px, transparent 1.5px),
    radial-gradient(circle at 82% 52%, #fff0c0 0 1px, transparent 1.5px),

    radial-gradient(circle at 71% 66%, #fff 0 1px, transparent 1.4px),
    radial-gradient(circle at 35% 76%, #d4d5ff 0 1px, transparent 1.5px);

  opacity:.7;
}

.starfield::before,
.starfield::after{
  content:"";

  position:absolute;
  inset:0;

  background:inherit;
}

.starfield::before{
  transform:translate(7%,18%) scale(.82);
  opacity:.43;
}

.starfield::after{
  transform:translate(-12%,32%) scale(.72);
  opacity:.28;
}

/* --------------------------------------------------
   LIBRARY ARCHITECTURE
-------------------------------------------------- */

.library{
  position:absolute;
  inset:0;
  z-index:-8;

  pointer-events:none;
}

/* main celestial window */

.main-window{
  position:absolute;

  left:50%;
  top:8%;

  width:min(68vw,590px);
  height:min(69vh,720px);

  transform:translateX(-50%);

  border:
    1px solid
    rgba(216,184,107,.26);

  border-bottom:none;

  border-radius:
    52% 52% 0 0 /
    25% 25% 0 0;

  box-shadow:
    inset 0 0 80px rgba(89,125,187,.09),
    0 0 100px rgba(0,0,0,.42);
}

.main-window::before{
  content:"";

  position:absolute;
  inset:7% 9% 0;

  border:
    1px solid
    rgba(216,184,107,.12);

  border-bottom:none;

  border-radius:
    54% 54% 0 0 /
    26% 26% 0 0;
}

.main-window::after{
  content:"";

  position:absolute;

  left:50%;
  top:2%;
  bottom:0;

  width:1px;

  background:
    linear-gradient(
      transparent,
      rgba(216,184,107,.18),
      rgba(216,184,107,.05)
    );
}

/* shelves */

.shelf{
  position:absolute;

  top:8%;
  bottom:0;

  width:19%;

  opacity:.48;
}

.shelf.left{
  left:0;
}

.shelf.right{
  right:0;
}

.shelf::before{
  content:"";

  position:absolute;
  inset:0;

  background:

    repeating-linear-gradient(
      180deg,
      transparent 0 10%,
      rgba(205,175,101,.17) 10.2% 10.5%,
      transparent 10.8% 18%
    ),

    repeating-linear-gradient(
      90deg,
      rgba(9,19,31,.75) 0 10%,
      rgba(90,72,46,.18) 10% 13%,
      rgba(9,19,31,.70) 13% 20%
    );

  border-left:
    1px solid rgba(216,184,107,.14);

  border-right:
    1px solid rgba(216,184,107,.14);
}

/* pillars */

.pillar{
  position:absolute;

  top:0;
  bottom:0;

  width:24px;

  background:
    linear-gradient(
      90deg,
      rgba(62,48,27,.35),
      rgba(222,194,119,.24),
      rgba(73,58,34,.19)
    );

  box-shadow:
    0 0 20px rgba(0,0,0,.4);
}

.pillar.p1{
  left:20%;
}

.pillar.p2{
  right:20%;
}

/* --------------------------------------------------
   HEADER
-------------------------------------------------- */

.header{
  position:relative;

  z-index:30;

  text-align:center;

  padding:
    calc(env(safe-area-inset-top) + 18px)
    18px
    0;
}

.back-button{
  position:absolute;

  left:15px;
  top:calc(env(safe-area-inset-top) + 17px);

  width:44px;
  height:44px;

  border-radius:50%;

  display:grid;
  place-items:center;

  text-decoration:none;

  border:
    1px solid
    rgba(232,204,132,.36);

  color:#fff8db;

  background:
    rgba(5,13,23,.48);

  backdrop-filter:
    blur(10px);

  font-size:27px;
  font-family:Georgia,serif;
}

.brand-star{
  color:var(--gold-bright);

  font-size:18px;

  text-shadow:
    0 0 14px
    rgba(246,225,158,.5);
}

.brand{
  margin-top:4px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:11px;

  letter-spacing:.25em;

  color:#e8d69c;
}

.title{
  margin:
    10px 0 1px;

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    Georgia,
    serif;

  font-size:
    clamp(27px,7vw,40px);

  font-weight:500;

  color:#fff4d1;

  letter-spacing:.05em;

  text-shadow:
    0 0 26px
    rgba(228,195,109,.18);
}

.subtitle{
  font-family:
    Georgia,
    serif;

  font-size:10px;

  letter-spacing:.32em;

  color:#bca466;
}

.divider{
  margin:
    12px auto 0;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:10px;

  width:150px;
}

.divider::before,
.divider::after{
  content:"";

  height:1px;
  flex:1;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(218,186,108,.45)
    );
}

.divider::after{
  transform:scaleX(-1);
}

.divider span{
  color:#efd888;
  font-size:10px;
}

.prompt{
  margin:
    11px auto 0;

  max-width:480px;

  font-size:12px;

  line-height:1.8;

  color:#d7deea;
}

/* --------------------------------------------------
   ROOM
-------------------------------------------------- */

.room{
  position:relative;

  max-width:760px;

  margin:
    0 auto;

  min-height:
    min(760px,73vh);

  padding:
    10px 5px 100px;

  z-index:10;
}

/* --------------------------------------------------
   OWL
-------------------------------------------------- */

.owl{
  position:absolute;

  left:
    clamp(-2px,4vw,35px);

  top:27%;

  width:
    clamp(112px,28vw,182px);

  z-index:19;

  filter:
    drop-shadow(
      0 20px 30px
      rgba(0,0,0,.58)
    );
}

.owl svg{
  display:block;
  width:100%;
}

/* --------------------------------------------------
   TAROT CARD
-------------------------------------------------- */

.oracle-card{
  position:absolute;

  left:50%;
  top:20%;

  transform:
    translateX(-50%)
    rotate(-1deg);

  width:
    clamp(75px,20vw,118px);

  aspect-ratio:.625;

  z-index:24;

  border-radius:10px;

  overflow:hidden;

  border:
    1px solid
    rgba(246,220,147,.78);

  background:

    radial-gradient(
      circle at 50% 45%,
      rgba(224,190,99,.13),
      transparent 18%
    ),

    linear-gradient(
      140deg,
      #123452,
      #071729 58%,
      #102d49
    );

  box-shadow:
    0 0 8px
    rgba(255,231,160,.15),

    0 0 26px
    rgba(221,189,101,.2),

    0 18px 34px
    rgba(0,0,0,.52);
}

.oracle-card::before{
  content:"";

  position:absolute;
  inset:7px;

  border-radius:7px;

  border:
    1px solid
    rgba(229,201,126,.63);
}

.card-art{
  position:absolute;
  inset:15px;

  display:grid;
  place-items:center;
}

.card-circle{
  position:absolute;

  width:66%;
  aspect-ratio:1;

  border-radius:50%;

  border:
    1px solid
    rgba(234,205,127,.54);
}

.card-circle::before,
.card-circle::after{
  content:"";

  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  border:
    1px solid
    rgba(234,205,127,.24);
}

.card-circle::before{
  width:72%;
  height:72%;
}

.card-circle::after{
  width:135%;
  height:35%;
}

.card-star{
  position:relative;

  font-family:Georgia,serif;

  font-size:
    clamp(28px,8vw,52px);

  color:#efd582;

  text-shadow:
    0 0 14px
    rgba(247,226,156,.53);
}

.card-moon{
  position:absolute;

  left:50%;

  transform:
    translateX(-50%);

  color:
    rgba(238,213,142,.72);

  font-size:15px;
}

.card-moon.top{
  top:5%;
}

.card-moon.bottom{
  bottom:5%;
  transform:
    translateX(-50%)
    rotate(180deg);
}

/* --------------------------------------------------
   LIGHT CONNECTION
-------------------------------------------------- */

.light-column{
  position:absolute;

  left:50%;
  top:34%;

  width:2px;
  height:225px;

  transform:
    translateX(-50%);

  z-index:12;

  background:
    linear-gradient(
      180deg,
      rgba(250,228,157,0),
      rgba(250,228,157,.5),
      rgba(250,228,157,.06)
    );

  box-shadow:
    0 0 16px
    rgba(245,220,149,.34);
}

/* --------------------------------------------------
   CRYSTAL BOARD
-------------------------------------------------- */

.board-area{
  position:absolute;

  left:50%;
  bottom:3%;

  transform:
    translateX(-50%);

  width:
    min(94vw,640px);

  aspect-ratio:1.30;

  z-index:13;
}

/* metal outer rim */

.outer-ring{
  position:absolute;

  left:50%;
  top:50%;

  width:87%;
  aspect-ratio:1;

  transform:
    translate(-50%,-50%)
    perspective(780px)
    rotateX(59deg);

  border-radius:50%;

  border:
    3px double
    rgba(223,195,120,.55);

  box-shadow:
    0 0 0 7px
    rgba(94,72,41,.14),

    0 0 0 9px
    rgba(218,186,109,.13),

    0 34px 70px
    rgba(0,0,0,.72);
}

/* crystal surface */

.crystal-board{
  position:absolute;

  left:50%;
  top:50%;

  width:80%;
  aspect-ratio:1;

  transform:
    translate(-50%,-50%)
    perspective(780px)
    rotateX(59deg);

  border-radius:50%;

  border:
    1px solid
    rgba(229,215,173,.55);

  overflow:hidden;

  background:

    radial-gradient(
      circle at 50% 51%,
      rgba(244,226,163,.10)
      0 4%,
      transparent 5%
    ),

    radial-gradient(
      circle at 37% 62%,
      rgba(131,89,184,.34),
      transparent 27%
    ),

    radial-gradient(
      circle at 61% 42%,
      rgba(62,123,189,.32),
      transparent 30%
    ),

    radial-gradient(
      circle at 54% 65%,
      rgba(55,92,151,.18),
      transparent 35%
    ),

    rgba(11,35,57,.56);

  backdrop-filter:
    blur(5px);

  box-shadow:

    inset 0 0 24px
    rgba(155,210,242,.13),

    inset 0 0 70px
    rgba(39,69,118,.23),

    0 0 25px
    rgba(143,167,218,.07);
}

/* stars below glass */

.crystal-board::before{
  content:"";

  position:absolute;
  inset:0;

  background-image:

    radial-gradient(circle at 15% 25%, #fff 0 1px, transparent 1.5px),
    radial-gradient(circle at 28% 70%, #dcd4ff 0 1px, transparent 1.4px),
    radial-gradient(circle at 41% 33%, #fff1bd 0 1px, transparent 1.5px),
    radial-gradient(circle at 58% 24%, #fff 0 1px, transparent 1.5px),
    radial-gradient(circle at 66% 61%, #c8dfff 0 1px, transparent 1.5px),
    radial-gradient(circle at 81% 42%, #fff1c3 0 1px, transparent 1.5px),

    radial-gradient(circle at 52% 52%, rgba(255,255,255,.9) 0 1px, transparent 2px);

  opacity:.78;
}

/* glass reflection */

.crystal-board::after{
  content:"";

  position:absolute;

  left:-10%;
  top:13%;

  width:70%;
  height:22%;

  transform:
    rotate(-17deg);

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.12),
      transparent
    );

  filter:
    blur(8px);

  opacity:.65;
}

/* --------------------------------------------------
   STAR CHART
-------------------------------------------------- */

.star-chart{
  position:absolute;

  left:50%;
  top:49%;

  width:65%;
  aspect-ratio:1;

  transform:
    translate(-50%,-50%)
    perspective(780px)
    rotateX(59deg);

  z-index:17;
}

.star-chart svg{
  width:100%;
  height:100%;
  overflow:visible;
}

.chart-line{
  fill:none;

  stroke:
    rgba(224,195,116,.38);

  stroke-width:.7;
}

.chart-soft{
  fill:none;

  stroke:
    rgba(180,191,221,.20);

  stroke-width:.7;
}

.chart-cross{
  stroke:
    rgba(224,195,116,.22);

  stroke-width:.6;
}

.single-point{
  fill:#f8dfa0;

  filter:
    drop-shadow(
      0 0 7px
      rgba(248,222,151,.75)
    );
}

/* --------------------------------------------------
   STAR CORE
-------------------------------------------------- */

.star-core{
  position:absolute;

  left:50%;
  top:52%;

  transform:
    translate(-50%,-50%);

  width:
    clamp(54px,14vw,88px);

  aspect-ratio:1;

  z-index:23;

  border-radius:50%;

  background:

    radial-gradient(
      circle at 36% 30%,
      #fffdf0 0 4%,
      #f7e4a7 7%,
      #bca7e0 22%,
      #617dba 39%,
      #23405e 58%,
      #08131f 73%
    );

  border:
    1px solid
    rgba(247,225,157,.83);

  box-shadow:

    inset 0 0 17px
    rgba(255,255,255,.21),

    0 0 11px
    rgba(244,219,146,.51),

    0 0 36px
    rgba(128,113,196,.43),

    0 0 60px
    rgba(65,117,173,.17);
}

.star-core::before{
  content:"";

  position:absolute;

  inset:16%;

  border-radius:50%;

  border:
    1px solid
    rgba(255,245,204,.34);
}

.star-core::after{
  content:"✦";

  position:absolute;
  inset:0;

  display:grid;
  place-items:center;

  color:#fff2bc;

  font-size:25px;

  text-shadow:
    0 0 14px
    #ffe7a2;
}

/* --------------------------------------------------
   CRYSTALS AROUND BOARD
-------------------------------------------------- */

.crystal{
  position:absolute;

  width:18px;
  height:55px;

  z-index:22;

  opacity:.87;

  background:
    linear-gradient(
      90deg,
      rgba(180,210,235,.25),
      rgba(255,255,255,.84),
      rgba(139,155,223,.25)
    );

  clip-path:
    polygon(
      50% 0,
      90% 26%,
      78% 100%,
      22% 100%,
      10% 26%
    );

  filter:
    drop-shadow(
      0 0 9px
      rgba(212,228,255,.4)
    );
}

.c1{
  left:12%;
  bottom:17%;
}

.c2{
  right:12%;
  bottom:17%;
}

.c3{
  left:23%;
  top:28%;
  transform:scale(.68);
}

.c4{
  right:23%;
  top:28%;
  transform:scale(.68);
}

/* --------------------------------------------------
   MIST
-------------------------------------------------- */

.mist{
  position:absolute;

  left:4%;
  right:4%;
  bottom:13%;

  height:150px;

  z-index:20;

  pointer-events:none;

  opacity:.62;
}

.mist::before,
.mist::after{
  content:"";

  position:absolute;

  border-radius:50%;

  filter:
    blur(25px);
}

.mist::before{
  left:0;
  right:42%;
  top:24%;
  bottom:5%;

  background:
    radial-gradient(
      ellipse,
      rgba(172,190,225,.15),
      rgba(129,146,200,.05) 50%,
      transparent 70%
    );
}

.mist::after{
  left:38%;
  right:0;
  top:2%;
  bottom:26%;

  background:
    radial-gradient(
      ellipse,
      rgba(164,131,203,.14),
      rgba(105,126,180,.05) 55%,
      transparent 72%
    );
}

/* --------------------------------------------------
   AMBIENT PARTICLES — STATIC FOR STAGE 2
-------------------------------------------------- */

.spark{
  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:#fff2bc;

  box-shadow:
    0 0 7px
    rgba(252,231,163,.75);

  z-index:21;
}

.s1{left:38%;top:42%}
.s2{left:57%;top:38%;transform:scale(.7)}
.s3{left:65%;top:51%;transform:scale(.5)}
.s4{left:34%;top:59%;transform:scale(.6)}
.s5{left:53%;top:48%;transform:scale(.45)}

/* --------------------------------------------------
   UI BOTTOM
-------------------------------------------------- */

.bottom-ui{
  position:absolute;

  left:50%;
  bottom:
    max(
      18px,
      env(safe-area-inset-bottom)
    );

  transform:
    translateX(-50%);

  width:
    min(86vw,450px);

  z-index:50;

  text-align:center;
}

.small-caption{
  margin-bottom:9px;

  font-size:10px;

  letter-spacing:.04em;

  color:
    rgba(213,221,232,.73);
}

.main-button{
  width:100%;

  height:52px;

  border-radius:999px;

  border:
    1px solid
    rgba(224,194,117,.59);

  color:#fff6d7;

  background:
    linear-gradient(
      180deg,
      rgba(28,48,70,.91),
      rgba(10,24,39,.95)
    );

  box-shadow:

    inset 0 0 22px
    rgba(232,205,133,.05),

    0 9px 28px
    rgba(0,0,0,.42);

  letter-spacing:.09em;

  font-size:15px;
}

.main-button small{
  display:block;

  margin-top:2px;

  font-size:8px;

  color:#a99b75;

  letter-spacing:.09em;
}

/* --------------------------------------------------
   STAGE LABEL
-------------------------------------------------- */

.stage-label{
  position:absolute;

  right:10px;
  top:10px;

  z-index:55;

  padding:
    5px 8px;

  border-radius:999px;

  border:
    1px solid
    rgba(215,184,107,.18);

  background:
    rgba(2,9,17,.43);

  font-size:9px;

  color:#aa9b74;
}

/* --------------------------------------------------
   RESPONSIVE
-------------------------------------------------- */

@media(max-width:500px){

  .room{
    min-height:
      660px;
  }

  .owl{
    top:30%;
  }

  .oracle-card{
    top:20%;
  }

  .board-area{
    bottom:7%;
  }

  .prompt{
    padding:
      0 34px;
  }

}

@media(min-width:760px){

  .room{
    min-height:760px;
  }

}
</style>
</head>

<body>

<main class="astral-scene">

  <!-- stars -->
  <div class="starfield"></div>

  <!-- architectural background -->
  <div class="library">
    <div class="shelf left"></div>
    <div class="shelf right"></div>

    <div class="pillar p1"></div>
    <div class="pillar p2"></div>

    <div class="main-window"></div>
  </div>

  <div class="stage-label">
    VISUAL PROTOTYPE • STAGE 2
  </div>


  <!-- HEADER -->
  <header class="header">

    <a
      class="back-button"
      href="index.html"
      aria-label="戻る"
    >
      ‹
    </a>
