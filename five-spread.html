<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>5スプレッド - タロット占い</title>
<meta name="theme-color" content="#120d18">
<style>
:root{--gold:#d8b45f;--text:#f8f3ff;--muted:#cfc3df;--panel:rgba(31,24,43,.9)}*{box-sizing:border-box}body{margin:0;padding:14px;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 16% 4%,rgba(142,107,216,.32),transparent 30%),radial-gradient(circle at 86% 18%,rgba(216,180,95,.22),transparent 26%),linear-gradient(180deg,#120d18,#09070d);min-height:100vh}.app{max-width:1050px;margin:auto}.panel{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.055));border:1px solid rgba(216,180,95,.25);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 18px 52px rgba(0,0,0,.3)}h1,h2,h3{color:#fff6d8}h1{text-align:center}.lead,.small{color:var(--muted);line-height:1.7}.lead{text-align:center}.intro{text-align:center;line-height:1.9;background:rgba(216,180,95,.10);border:1px solid rgba(216,180,95,.28);border-radius:18px;padding:16px}.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:9px}.card{height:112px;border-radius:13px;border:2px solid rgba(216,180,95,.75);background:linear-gradient(145deg,#382650,#181020 58%,#3b2a50);color:#fff;cursor:pointer;position:relative}.card:after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);font-size:28px}.card.used{opacity:.45;pointer-events:none}.card.used:after{display:none}.card .face{display:none;text-align:center;padding:8px;font-size:11px}.card.used .face{display:block}.num{display:inline-block;background:#fef3c7;color:#21172b;border-radius:999px;padding:2px 7px;font-weight:900;margin-bottom:5px}.spread{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.slot{background:#ffffff10;border:1px solid #ffffff25;border-radius:16px;padding:12px;text-align:center}.slot .symbol{font-size:32px}.slot .name{font-weight:900;margin-top:5px}.slot .pos{font-size:12px;color:#fde68a}.slot .label{font-size:12px;color:#d9ccff;margin-top:6px;line-height:1.4}textarea{width:100%;min-height:90px;border:1px solid rgba(216,180,95,.32);border-radius:14px;background:#120e18;color:var(--text);padding:13px 14px;font-size:16px}button.action{border:0;border-radius:999px;padding:12px 18px;font-weight:900;background:linear-gradient(135deg,#f1d98b,#c99b3f);color:#160f1f;cursor:pointer}.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}.reading{line-height:1.85}.item{background:#ffffff10;border:1px solid #ffffff20;border-radius:16px;padding:13px;margin:10px 0}.hidden{display:none!important}.counter{text-align:center;color:#fde68a;margin:8px}.copy{min-height:190px;font-size:13px}@media(max-width:760px){.spread{grid-template-columns:1fr}.slot{display:grid;grid-template-columns:64px 1fr;gap:8px;text-align:left}.slot .symbol{grid-row:1/5;align-self:center;text-align:center}.deck{grid-template-columns:repeat(auto-fill,minmax(62px,1fr))}.card{height:100px}}
</style>
</head>
<body><div class="app">
<h1>✦ 5スプレッド</h1><p class="lead">5枚で「現在・障害・助言・近未来・最終結果」を読みます。カードを先に選び、そのあと質問を入力します。</p>
<section class="panel"><div class="intro">占いたい内容を心に思い浮かべてください。<br>準備ができたらシャッフルし、直感で5枚選びます。</div><div class="buttons"><button class="action" onclick="start()">カードをシャッフルする</button></div><p id="status" class="small" style="text-align:center">まだカードは選ばれていません。</p></section>
<section id="deckPanel" class="panel hidden"><h2 style="text-align:center">カードを5枚選んでください</h2><div id="counter" class="counter">0 / 5</div><div id="deck" class="deck"></div></section>
<section id="spreadPanel" class="panel hidden"><h2 style="text-align:center">5枚の展開</h2><div id="spread" class="spread"></div><div style="margin-top:18px"><label><strong>占いたい内容</strong></label><textarea id="question" placeholder="例：千葉のお客さんは実際の内見を経て購入されますか？"></textarea><div class="buttons"><button class="action" onclick="readSpread()">長文リーディングを表示する</button></div></div></section>
<section id="resultPanel" class="panel hidden"><div id="reading" class="reading"></div><h2>GPTでさらに深掘りする文章</h2><p class="small">下の文章をChatGPTへ貼り付けると、5枚の関係性まで含めて詳しく読めます。</p><textarea id="copyText" class="copy" readonly></textarea><div class="buttons"><button class="action" onclick="copyPrompt()">GPT用文章をコピー</button><button class="action" onclick="start()">もう一度占う</button></div><p id="toast" class="small" style="text-align:center"></p></section>
</div><script>
const TAROT=[
['愚者','🃏','新しい始まり、自由、未知への一歩。','準備不足、軽率さ、見通しの甘さ。'],['魔術師','✴','行動力、創造力、実現力。','空回り、準備不足、力をうまく使えていない。'],['女教皇','☾','直感、知性、静かな判断。','考えすぎ、不安、情報不足。'],['女帝','🌿','豊かさ、成長、魅力。','甘え、停滞、過剰な期待。'],['皇帝','♜','安定、責任、現実的な勝ち筋。','頑固、圧力、柔軟性不足。'],['教皇','♙','信頼、助言、正攻法。','形式への縛り、古いやり方への違和感。'],['恋人','♡','選択、調和、納得感。','迷い、不一致、優柔不断。'],['戦車','⚔','前進、勝負、突破力。','焦り、暴走、方向違い。'],['力','♌','粘り、信頼、内面の強さ。','自信不足、消耗、不安。'],['隠者','☌','熟考、専門性、静かな答え。','孤立、考えすぎ、遅れ。'],['運命の輪','◎','転機、好機、タイミング。','タイミング違い、停滞、予測不能。'],['正義','⚖','公平、契約、妥当な判断。','不均衡、条件の見落とし、判断ミス。'],['吊るされた男','☍','待つ価値、視点転換、忍耐。','報われにくい我慢、停滞、犠牲感。'],['死神','♱','区切り、変化、再出発。','未練、変化への抵抗、先延ばし。'],['節制','♒','調整、バランス、穏やかな改善。','中途半端、不調和、ペースの乱れ。'],['悪魔','♑','執着、誘惑、魅力ある罠。','依存からの解放、悪循環の断ち切り。'],['塔','⚡','急変、破壊、想定外。','崩壊回避、小さな崩れ、警告。'],['星','✧','希望、回復、未来の可能性。','期待先行、現実感不足、不安。'],['月','☽','不安、曖昧さ、見えない要素。','誤解が晴れる、真実が見える。'],['太陽','☀','成功、明るい結果、満足。','成功はあるが遅い、詰めの甘さ、過信。'],['審判','✺','再評価、復活、決断の時。','決断遅れ、過去への未練。'],['世界','◉','完成、達成、最良の着地。','あと一歩、未完成、詰め不足。']];
const POS=[['1. 現在','今この問題で最も強く働いている状況'],['2. 障害','進行を妨げているもの、注意すべき点'],['3. 助言','現実を動かすために取るべき姿勢や行動'],['4. 近未来','このまま進んだ場合に近く表面化しやすい展開'],['5. 最終結果','現在の流れが向かいやすい着地点']];
let deck=[],sel=[],question='',readingText='';
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function start(){deck=shuffle(TAROT.map((x,i)=>({n:x[0],s:x[1],u:x[2],r:x[3],rev:Math.random()<.45,id:i})));sel=[];question='';readingText='';document.getElementById('deckPanel').classList.remove('hidden');document.getElementById('spreadPanel').classList.add('hidden');document.getElementById('resultPanel').classList.add('hidden');document.getElementById('status').textContent='心の中でテーマを保ったまま5枚選んでください。';renderDeck();window.scrollTo({top:0,behavior:'smooth'})}
function renderDeck(){const e=document.getElementById('deck');e.innerHTML='';deck.forEach(c=>{const used=sel.includes(c),b=document.createElement('button');b.className='card'+(used?' used':'');b.disabled=used||sel.length>=5;if(used){const k=sel.indexOf(c)+1;b.innerHTML=`<div class="face"><span class="num">${k}</span><br><b>${c.s} ${c.n}</b><br>${c.rev?'逆位置':'正位置'}</div>`}b.onclick=()=>{sel.push(c);renderDeck();document.getElementById('status').textContent=sel.length<5?`あと${5-sel.length}枚選んでください。`:'5枚選び終わりました。質問を入力してください。';if(sel.length===5)renderSpread()};e.appendChild(b)});document.getElementById('counter').textContent=sel.length+' / 5'}
function renderSpread(){document.getElementById('spreadPanel').classList.remove('hidden');document.getElementById('spread').innerHTML=sel.map((c,i)=>`<div class="slot"><div class="symbol">${c.s}</div><div class="name">${c.n}</div><div class="pos">${c.rev?'逆位置':'正位置'}</div><div class="label"><b>${POS[i][0]}</b><br>${POS[i][1]}</div></div>`).join('');document.getElementById('spreadPanel').scrollIntoView({behavior:'smooth',block:'start'})}
function meaning(c){return c.rev?c.r:c.u}
function readSpread(){if(sel.length!==5)return alert('先に5枚選んでください。');const q=document.getElementById('question').value.trim();if(!q)return alert('占いたい内容を入力してください。');question=q;let h=`<h2>5スプレッド・リーディング</h2><p><strong>占いたい内容：</strong>${escapeHtml(q)}</p><h3>全体の結論</h3><p>現在の「${sel[0].n}」から、障害の「${sel[1].n}」、助言の「${sel[2].n}」を経て、近未来の「${sel[3].n}」、最終結果の「${sel[4].n}」へ進む流れです。特に3枚目の助言を現実の行動へ落とし込めるかが、5枚目の結果を良い方向へ寄せる鍵になります。</p>`;h+=sel.map((c,i)=>`<div class="item"><h3>${POS[i][0]}：${c.n}（${c.rev?'逆位置':'正位置'}）</h3><p><strong>位置の意味：</strong>${POS[i][1]}</p><p>${meaning(c)}</p><p>${c.rev?'逆位置なので、失敗確定ではなく、準備不足・認識のずれ・タイミングの調整点として読むのが現実的です。':'正位置なのでカード本来の性質が比較的素直に出やすい状態です。良い流れでも確認を省かないことが大切です。'}</p></div>`).join('');h+=`<h3>現実的な行動アドバイス</h3><p>まず障害の「${sel[1].n}」が示す問題を具体化し、助言の「${sel[2].n}」を一つの行動に変えてください。相手がいる問いなら連絡・条件・返答期限、お金なら金額・損益・期限、仕事なら担当・工数・判断期限のように数字や事実へ置き換えると、この展開を現実に活かしやすくなります。</p><h3>短くまとめると</h3><p>結論カードは「${sel[4].n}（${sel[4].rev?'逆位置':'正位置'}）」。ただし固定された未来ではありません。障害への対処と助言カードの実行によって、着地点は変わり得ます。</p>`;document.getElementById('reading').innerHTML=h;readingText=document.getElementById('reading').innerText;document.getElementById('copyText').value=promptText();document.getElementById('resultPanel').classList.remove('hidden');document.getElementById('resultPanel').scrollIntoView({behavior:'smooth',block:'start'})}
function promptText(){const lines=sel.map((c,i)=>`${POS[i][0]}：${c.n}（${c.rev?'逆位置':'正位置'}）`).join('\n');return `以下はタロット占いアプリで出た5スプレッドの結果です。\nこの内容をもとに、5枚の関係性を重視し、かなり詳しく、現実的な行動アドバイスまで含めて日本語で深掘り解説してください。\n\n【占いの種類】\n5スプレッド\n\n【占いたい内容】\n${question}\n\n【出たカード】\n${lines}\n\n【アプリ内リーディング】\n${readingText}\n\n【解説してほしいこと】\n・全体の結論\n・5枚それぞれの役割と意味\n・カード同士のつながり\n・正位置／逆位置を踏まえた注意点\n・質問内容に対してどう読めるか\n・現実的にどう行動すべきか\n・避けた方がいい判断\n・最後に短くまとめたアドバイス`}
function copyPrompt(){const b=document.getElementById('copyText');b.value=promptText();b.focus();b.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(ok){document.getElementById('toast').textContent='コピーしました。ChatGPTに貼り付けて深掘りできます。'}else if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(b.value).then(()=>document.getElementById('toast').textContent='コピーしました。ChatGPTに貼り付けて深掘りできます。').catch(()=>document.getElementById('toast').textContent='自動コピーできませんでした。文章を選択してコピーしてください。')}else document.getElementById('toast').textContent='文章を選択してコピーしてください。'}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
