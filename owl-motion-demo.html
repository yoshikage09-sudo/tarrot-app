<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星の書庫 — フクロウの仕草</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060d1a;color:#eadbb9;font-family:serif;text-align:center}.page{max-width:520px;margin:auto;padding:26px 20px 24px;background:radial-gradient(ellipse at 50% 44%,#27314b,#080f20 65%);min-height:100svh}small{font-size:10px;letter-spacing:.25em}h1{font-size:23px;font-weight:400;margin:12px 0 4px}p{font-size:12px;line-height:1.8;color:#bdb6ad}.stage{position:relative;width:min(100%,300px);margin:0 auto;aspect-ratio:480/852;isolation:isolate;overflow:hidden}.aura{position:absolute;inset:10% -15% 0;border-radius:50%;background:radial-gradient(ellipse,#dab27416,transparent 65%);pointer-events:none}.owl{position:absolute;inset:0;filter:drop-shadow(0 8px 18px #0008)}.layer,.head,.torso,.feet{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.layer{object-fit:fill}.torso{clip-path:inset(39% 0 14%)}.breath-canvas{position:absolute;inset:0;width:100%;height:100%}.torso.ready>.layer{visibility:hidden}.feet{clip-path:inset(84% 0 0)}.head{transform-origin:57% 39%;clip-path:inset(0 0 59%);will-change:transform}.eyes{opacity:0;mask-image:radial-gradient(ellipse 9% 4.1% at 44% 25.5%,#000 80%,transparent 100%),radial-gradient(ellipse 9% 4.1% at 68% 28.5%,#000 80%,transparent 100%);transition:opacity 95ms ease-in}.blink .eyes{opacity:1}.brooch{position:absolute;left:64.5%;top:43.5%;width:10px;height:10px;transform:translate(-50%,-50%);border-radius:50%;opacity:0;background:#fff9d3;box-shadow:0 0 9px 4px #ffe7a3,0 0 25px 12px #eab85a80,0 0 55px 28px #d7b77433}.brooch:before,.brooch:after{content:'';position:absolute;background:linear-gradient(transparent,#fff6c7,transparent);left:50%;top:50%;transform:translate(-50%,-50%);width:2px;height:44px}.brooch:after{transform:translate(-50%,-50%) rotate(90deg)}.respond .head{animation:tilt 3.3s cubic-bezier(.42,0,.25,1) both}.respond .brooch{animation:glow 2.3s 1.05s ease-in-out both}.ring{position:absolute;left:14%;right:14%;height:10%;bottom:0;border:1px solid #b39b6255;border-radius:50%;box-shadow:0 0 22px #caa55c12}.respond .ring{animation:ring 2s 1.65s both}button{font:inherit;color:#f8e8bc;background:linear-gradient(#223043,#0d1728);border:1px solid #b49b61;border-radius:30px;padding:15px 30px;min-height:48px;cursor:pointer;width:min(100%,330px)}button:disabled{opacity:.65;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #fff1b0;outline-offset:4px}label{display:block;font-size:12px;margin:18px 0}#status{min-height:24px;margin:10px 0}.note{font-size:11px;margin:12px auto 0;max-width:340px}body.still .torso{animation:none}body.still .head{animation:none}body.still .eyes{transition:none}body.still .brooch,body.still .ring{animation:none}.still .respond .brooch{opacity:.65}
@keyframes tilt{0%,6%{transform:rotate(0)}32%,54%{transform:rotate(2.99deg)}100%{transform:rotate(0)}}@keyframes glow{0%,100%{opacity:0;scale:.8}35%{opacity:.9;scale:1}70%{opacity:.45;scale:1.1}}@keyframes ring{0%,100%{opacity:.4}45%{opacity:1;box-shadow:0 0 25px #e7c58366}}@media(max-height:740px){.stage{width:min(100%,270px)}.page{padding-top:18px}}@media(prefers-reduced-motion:reduce){.torso{animation:none}.respond .head{animation:none}.eyes{transition:none}}
</style><main class="page"><small>ASTRAL LIBRARY · MOTION STUDY</small><h1>星の書庫の案内役</h1><p>胸元がゆっくり膨らみ、静かに戻ります。</p><div class="stage"><div class="aura"></div><div class="ring"></div><div class="owl" id="owl" role="img" aria-label="紺と金の羽を持つフクロウ。呼びかけると瞬きし、少し首を傾けます。"><div class="feet"><img class="layer" src="owl-open.png" alt=""></div><div class="torso"><img class="layer" src="owl-open.png" alt=""><canvas class="breath-canvas" width="480" height="852" aria-hidden="true"></canvas><span class="brooch"></span></div><div class="head"><img class="layer" src="owl-open.png" alt=""><img class="layer eyes" src="owl-closed.png" alt=""></div></div></div><p id="status" role="status">あなたに気づくのを待っています。</p><button id="greet" disabled>素材を読み込み中…</button><label><input id="still" type="checkbox"> 動きを控えめにする</label><p class="note">呼吸を強めた比較用試作です（約5秒周期）。首元と足元は固定し、胸の中央だけを動かしています。ボタンを押して約0.2秒後に反応し、瞬き・首かしげの後に胸元が光ります。</p></main>
<script>
const owl=document.querySelector('#owl'),button=document.querySelector('#greet'),statusLine=document.querySelector('#status'),still=document.querySelector('#still');let busy=false,timer;const wait=ms=>new Promise(r=>setTimeout(r,ms));still.checked=matchMedia('(prefers-reduced-motion:reduce)').matches;
function motion(){document.body.classList.toggle('still',still.checked)}motion();still.addEventListener('change',motion);
async function blink(){owl.classList.add('blink');await wait(160);owl.classList.remove('blink')}
function schedule(){clearTimeout(timer);timer=setTimeout(async()=>{if(!busy&&!document.hidden&&!still.checked)await blink();schedule()},4700+Math.random()*3400)}
button.addEventListener('click',async()=>{if(busy)return;busy=true;clearTimeout(timer);button.disabled=true;statusLine.textContent='…';await wait(200);owl.classList.add('respond');owl.parentElement.classList.add('respond');await wait(150);await blink();await wait(700);statusLine.textContent='星の書庫へ、ようこそ。';await wait(2600);owl.classList.remove('respond');owl.parentElement.classList.remove('respond');button.disabled=false;button.textContent='もう一度、呼びかける';busy=false;schedule()});
// A local vertical warp: zero displacement and zero slope at both seams.
// The rigid collar, silhouette and feet retain their original registration.
function startBreathing(){
 const torso=document.querySelector('.torso'),source=torso.querySelector('img');
 const canvas=torso.querySelector('canvas'),ctx=canvas.getContext('2d');
 const W=480,H=852,top=H*.405,bottom=H*.84,step=3;
 let previous=0,phase=0;
 const weight=y=>{const t=Math.max(0,Math.min(1,(y-top)/(bottom-top)));return Math.sin(Math.PI*t)**2;};
 function frame(now){
  requestAnimationFrame(frame);
  if(now-previous<33)return;
  const dt=previous?Math.min(now-previous,80):0;previous=now;
  if(document.hidden)return;
  if(!still.checked)phase+=dt;
  const amount=still.checked?0:14*(.5-.5*Math.cos(phase/4800*Math.PI*2));
  ctx.clearRect(0,0,W,H);
  // Draw narrow horizontal strips; shared destination boundaries prevent cracks.
  for(let y=0;y<H;y+=step){
   const end=Math.min(y+step,H),dy=y-amount*weight(y),de=end-amount*weight(end);
   ctx.drawImage(source,0,y,W,end-y,0,dy,W,de-dy+.35);
  }
 }
 torso.classList.add('ready');requestAnimationFrame(frame);
}
Promise.all([...document.images].map(i=>i.decode())).then(()=>{startBreathing();button.disabled=false;button.textContent='フクロウに呼びかける';schedule()}).catch(()=>{statusLine.textContent='画像を読み込めませんでした。ページを再読み込みしてください。'});
</script></html>
