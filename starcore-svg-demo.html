<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<title>星核 + 単星の星図 技術デモ</title>
<style>
:root{
  --bg:#050b14;
  --panel:#081522;
  --gold:#e8cc7b;
  --gold2:#fff0b8;
  --blue:#8bc2ff;
  --violet:#9b86df;
  --text:#f5f3ea;
  --muted:#aab7c8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#02060d;color:var(--text);font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif}
body{overflow-x:hidden}
.demo{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 50% 42%,rgba(98,116,190,.15),transparent 32%),
    radial-gradient(circle at 50% 58%,rgba(68,112,170,.11),transparent 42%),
    linear-gradient(180deg,#081321 0%,#040a12 65%,#02060c 100%);
}
.wrap{width:min(94vw,720px);text-align:center}
.kicker{font-family:Georgia,serif;letter-spacing:.22em;font-size:11px;color:#d8c690;margin-bottom:8px}
h1{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(24px,6vw,38px);font-weight:500;margin:0;color:#fff4cf}
.note{max-width:560px;margin:8px auto 18px;color:var(--muted);font-size:13px;line-height:1.7}
.stage{
  position:relative;
  width:100%;
  aspect-ratio:1.35;
  min-height:430px;
  overflow:hidden;
  border-radius:26px;
  background:
    radial-gradient(circle at 50% 58%,rgba(127,96,181,.14),transparent 28%),
    radial-gradient(circle at 45% 52%,rgba(70,130,181,.10),transparent 32%),
    rgba(5,13,23,.82);
  border:1px solid rgba(232,204,123,.18);
  box-shadow:inset 0 0 80px rgba(108,142,191,.06),0 28px 70px rgba(0,0,0,.36);
}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.58;background-image:
 radial-gradient(circle at 12% 18%,#fff 0 1px,transparent 1.4px),
 radial-gradient(circle at 23% 43%,#ffe8aa 0 1px,transparent 1.5px),
 radial-gradient(circle at 34% 27%,#dce9ff 0 1px,transparent 1.4px),
 radial-gradient(circle at 63% 21%,#fff 0 1px,transparent 1.4px),
 radial-gradient(circle at 76% 36%,#e9dcff 0 1px,transparent 1.5px),
 radial-gradient(circle at 88% 18%,#fff0c4 0 1px,transparent 1.4px),
 radial-gradient(circle at 17% 74%,#fff 0 1px,transparent 1.4px),
 radial-gradient(circle at 69% 76%,#d8e6ff 0 1px,transparent 1.5px);
}
.board{
  position:absolute;left:50%;top:56%;transform:translate(-50%,-50%) perspective(780px) rotateX(58deg);
  width:76%;aspect-ratio:1;border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,242,188,.08) 0 4%,transparent 5% 23%,rgba(211,190,126,.06) 24% 24.5%,transparent 25%),
    radial-gradient(circle at 35% 62%,rgba(129,92,183,.21),transparent 28%),
    radial-gradient(circle at 65% 40%,rgba(66,120,176,.19),transparent 31%),
    rgba(13,34,54,.44);
  border:1px solid rgba(226,204,142,.44);
  box-shadow:inset 0 0 42px rgba(144,194,228,.10),0 0 0 8px rgba(123,101,58,.05),0 30px 70px rgba(0,0,0,.62);
}
.board::after{
  content:"";position:absolute;left:-5%;right:-5%;top:16%;height:18%;transform:rotate(-14deg);
  background:linear-gradient(180deg,rgba(255,255,255,.10),transparent);
  filter:blur(7px);opacity:.55;border-radius:50%;
}
.diagram{
  position:absolute;left:50%;top:53%;width:58%;aspect-ratio:1;transform:translate(-50%,-50%);
  filter:drop-shadow(0 0 4px rgba(240,215,139,.22));
}
.ring,.axis,.ray,.node-line{
  fill:none;stroke-linecap:round;stroke-linejoin:round;
}
.ring{stroke:rgba(229,206,139,.52);stroke-width:1.2}
.ring.soft{stroke:rgba(175,194,224,.22);stroke-width:.85}
.axis{stroke:rgba(229,206,139,.20);stroke-width:.8}
.ray{stroke:url(#goldStroke);stroke-width:1.8;filter:url(#softGlow)}
.draw{
  stroke-dasharray:1000;
  stroke-dashoffset:1000;
}
.node-line{stroke:rgba(235,215,151,.70);stroke-width:1.2;stroke-dasharray:220;stroke-dashoffset:220}
.star-node{fill:#fff0b0;opacity:0;filter:url(#strongGlow)}
.secondary{fill:#a8c7ee;opacity:0}
.core-shell{
  position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);
  width:clamp(72px,17vw,112px);aspect-ratio:1;border-radius:50%;z-index:8;
  background:
    radial-gradient(circle at 34% 28%,#fffdf0 0 3%,#f6e4a9 7%,#b5a4df 23%,#6481bc 40%,#24435f 60%,#08141f 75%);
  border:1px solid rgba(249,228,163,.78);
  box-shadow:0 0 8px rgba(247,222,148,.28),0 0 28px rgba(133,114,199,.32),0 0 64px rgba(65,118,170,.12);
}
.core-shell::before{content:"";position:absolute;inset:14%;border-radius:50%;border:1px solid rgba(255,246,207,.34)}
.core-shell::after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;font-size:32px;color:#fff0b7;text-shadow:0 0 10px #fff2bb,0 0 26px rgba(240,201,102,.75)}
.core-halo{
  position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);
  width:clamp(120px,28vw,190px);aspect-ratio:1;border-radius:50%;z-index:7;
  background:radial-gradient(circle,rgba(255,234,163,.20) 0 11%,rgba(143,126,209,.15) 26%,rgba(78,128,180,.08) 46%,transparent 70%);
  opacity:.35;
}
.pulse-ring{
  position:absolute;left:50%;top:57%;transform:translate(-50%,-50%) scale(.65);
  width:clamp(120px,28vw,190px);aspect-ratio:1;border-radius:50%;z-index:6;
  border:1px solid rgba(244,222,150,.28);opacity:0;
}
.spark{
  position:absolute;width:4px;height:4px;border-radius:50%;background:#fff0b0;
  box-shadow:0 0 8px rgba(255,239,181,.85);opacity:.15;
}
.spark.s1{left:42%;top:35%}.spark.s2{left:61%;top:41%;transform:scale(.7)}
.spark.s3{left:34%;top:56%;transform:scale(.55)}.spark.s4{left:67%;top:63%;transform:scale(.5)}
.beam-dot{
  position:absolute;left:50%;top:57%;width:9px;height:9px;border-radius:50%;z-index:9;
  transform:translate(-50%,-50%);background:#fff7cb;box-shadow:0 0 8px #fff3bb,0 0 22px rgba(244,205,112,.85);opacity:0;
}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
button{
  min-height:46px;padding:0 18px;border-radius:999px;border:1px solid rgba(232,204,123,.44);
  color:#fff5d3;background:linear-gradient(180deg,rgba(32,51,72,.94),rgba(10,23,38,.96));cursor:pointer;
}
button.secondary-btn{color:#cbd4df;border-color:rgba(179,193,214,.24);background:rgba(10,20,31,.8)}
button:focus-visible{outline:2px solid #fff3b4;outline-offset:3px}
.status{margin-top:10px;color:#c7d0dc;font-size:12px;min-height:20px}

/* animation states */
.stage.playing .core-shell{
  animation:coreWake 2.6s cubic-bezier(.22,.61,.36,1) both;
}
.stage.playing .core-halo{
  animation:haloWake 2.6s cubic-bezier(.22,.61,.36,1) both;
}
.stage.playing .pulse-ring{
  animation:ringPulse 1.5s ease-out .55s both;
}
.stage.playing .ring.outer{animation:drawLine 1.25s cubic-bezier(.3,.7,.2,1) .45s forwards}
.stage.playing .ring.mid{animation:drawLine 1.05s cubic-bezier(.3,.7,.2,1) .75s forwards}
.stage.playing .ring.inner{animation:drawLine .9s cubic-bezier(.3,.7,.2,1) 1.0s forwards}
.stage.playing .axis.a1{animation:drawLine .75s ease-out 1.15s forwards}
.stage.playing .axis.a2{animation:drawLine .75s ease-out 1.25s forwards}
.stage.playing .axis.a3{animation:drawLine .75s ease-out 1.35s forwards}
.stage.playing .axis.a4{animation:drawLine .75s ease-out 1.45s forwards}
.stage.playing .node-line{animation:drawNode .8s cubic-bezier(.22,.61,.36,1) 1.75s forwards}
.stage.playing .star-node{animation:nodeReveal .7s ease-out 2.28s forwards}
.stage.playing .secondary.n1{animation:smallNode .5s ease-out 1.65s forwards}
.stage.playing .secondary.n2{animation:smallNode .5s ease-out 1.82s forwards}
.stage.playing .secondary.n3{animation:smallNode .5s ease-out 1.95s forwards}
.stage.playing .beam-dot{animation:travel 1.0s cubic-bezier(.4,0,.2,1) 1.55s forwards}
.stage.playing .spark.s1{animation:sparkle 1.8s ease-in-out .5s both}
.stage.playing .spark.s2{animation:sparkle 1.8s ease-in-out .9s both}
.stage.playing .spark.s3{animation:sparkle 1.8s ease-in-out 1.2s both}
.stage.playing .spark.s4{animation:sparkle 1.8s ease-in-out 1.45s both}

@keyframes coreWake{
  0%{transform:translate(-50%,-50%) scale(.93);filter:brightness(.75) saturate(.85);box-shadow:0 0 4px rgba(247,222,148,.16),0 0 14px rgba(133,114,199,.18)}
  32%{transform:translate(-50%,-50%) scale(1.035);filter:brightness(1.35) saturate(1.08);box-shadow:0 0 12px rgba(255,235,173,.52),0 0 40px rgba(143,120,210,.52),0 0 76px rgba(72,133,188,.20)}
  58%{transform:translate(-50%,-50%) scale(.995);filter:brightness(1.08)}
  100%{transform:translate(-50%,-50%) scale(1);filter:brightness(1);box-shadow:0 0 10px rgba(247,222,148,.36),0 0 32px rgba(133,114,199,.37),0 0 62px rgba(65,118,170,.14)}
}
@keyframes haloWake{
  0%{opacity:.22;transform:translate(-50%,-50%) scale(.72)}
  35%{opacity:.72;transform:translate(-50%,-50%) scale(1.08)}
  100%{opacity:.40;transform:translate(-50%,-50%) scale(1)}
}
@keyframes ringPulse{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
  18%{opacity:.72}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}
}
@keyframes drawLine{to{stroke-dashoffset:0}}
@keyframes drawNode{to{stroke-dashoffset:0}}
@keyframes nodeReveal{
  0%{opacity:0;r:3}
  50%{opacity:1;r:8}
  100%{opacity:1;r:5}
}
@keyframes smallNode{from{opacity:0}to{opacity:.7}}
@keyframes travel{
  0%{opacity:0;transform:translate(-50%,-50%) translateY(0) scale(.6)}
  12%{opacity:1}
  82%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) translateY(-145px) scale(1)}
}
@keyframes sparkle{
  0%,100%{opacity:.12;transform:scale(.5)}
  50%{opacity:.95;transform:scale(1.35)}
}

@media(max-width:520px){
  .stage{aspect-ratio:.95;min-height:560px}
  .board{width:88%;top:61%}
  .diagram{width:72%;top:58%}
  .core-shell,.core-halo,.pulse-ring,.beam-dot{top:62%}
  @keyframes travel{
    0%{opacity:0;transform:translate(-50%,-50%) translateY(0) scale(.6)}
    12%{opacity:1}
    82%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-50%) translateY(-170px) scale(1)}
  }
}
@media(prefers-reduced-motion:reduce){
  .stage.playing *{animation:none!important}
  .draw,.node-line{stroke-dashoffset:0}
  .star-node{opacity:1}
  .secondary{opacity:.7}
}
</style>
</head>
<body>
<main class="demo">
  <div class="wrap">
    <div class="kicker">ASTRAL LIBRARY • TECH DEMO</div>
    <h1>星核発光 + 単星の星図</h1>
    <p class="note">CSSとSVGだけで、星核が目覚めて光が上へ走り、単星の星図が順番に描かれる演出を確認するための技術デモです。</p>

    <section class="stage" id="stage" aria-label="星核と単星の星図 技術デモ">
      <div class="stars" aria-hidden="true"></div>
      <div class="board" aria-hidden="true"></div>

      <svg class="diagram" viewBox="0 0 400 400" aria-label="単星の星図">
        <defs>
          <linearGradient id="goldStroke" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#8ba3c7" stop-opacity=".45"/>
            <stop offset=".45" stop-color="#d9bd72" stop-opacity=".8"/>
            <stop offset="1" stop-color="#fff0b6"/>
          </linearGradient>
          <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.6" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="5.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <circle cx="200" cy="200" r="150" class="ring outer draw"/>
        <circle cx="200" cy="200" r="112" class="ring soft mid draw"/>
        <circle cx="200" cy="200" r="70" class="ring soft inner draw"/>

        <line x1="50" y1="200" x2="350" y2="200" class="axis a1 draw"/>
        <line x1="200" y1="50" x2="200" y2="350" class="axis a2 draw"/>
        <line x1="94" y1="94" x2="306" y2="306" class="axis a3 draw"/>
        <line x1="306" y1="94" x2="94" y2="306" class="axis a4 draw"/>

        <circle cx="150" cy="145" r="2.2" class="secondary n1"/>
        <circle cx="257" cy="164" r="2.2" class="secondary n2"/>
        <circle cx="244" cy="254" r="2.2" class="secondary n3"/>

        <line x1="200" y1="242" x2="200" y2="118" class="node-line"/>
        <circle cx="200" cy="112" r="5" class="star-node"/>
      </svg>

      <div class="pulse-ring" aria-hidden="true"></div>
      <div class="core-halo" aria-hidden="true"></div>
      <div class="core-shell" aria-label="星核"></div>
      <div class="beam-dot" aria-hidden="true"></div>

      <div class="spark s1"></div>
      <div class="spark s2"></div>
      <div class="spark s3"></div>
      <div class="spark s4"></div>
    </section>

    <div class="controls">
      <button type="button" id="play">演出を見る</button>
      <button type="button" id="replay" class="secondary-btn">もう一度</button>
    </div>
    <div class="status" id="status" aria-live="polite">待機中</div>
  </div>
</main>

<script>
(() => {
  const stage = document.getElementById('stage');
  const play = document.getElementById('play');
  const replay = document.getElementById('replay');
  const status = document.getElementById('status');

  let timer = null;

  function run() {
    if (timer) clearTimeout(timer);
    stage.classList.remove('playing');
    void stage.offsetWidth;
    stage.classList.add('playing');
    status.textContent = '星核が目覚め、星図を解放しています…';
    timer = setTimeout(() => {
      status.textContent = '単星の星図が完成しました';
    }, 2950);
  }

  play.addEventListener('click', run);
  replay.addEventListener('click', run);
})();
</script>
</body>
</html>
