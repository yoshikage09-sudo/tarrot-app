<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>タロット占い</title>
<meta name="theme-color" content="#120d18">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#09070d;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif}.bar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#120d18;border-bottom:1px solid rgba(216,180,95,.28);color:#fff6d8}.bar a{color:#fff6d8;text-decoration:none;border:1px solid rgba(216,180,95,.35);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800}.title{font-size:13px;color:#cfc3df}iframe{display:block;width:100%;height:calc(100% - 52px);border:0;background:#09070d}
</style>
</head>
<body>
<div class="bar"><a href="index.html">← 占い選択に戻る</a><div id="title" class="title">タロット占い</div></div>
<iframe id="app" src="app.html" title="タロット占いアプリ"></iframe>
<script>
const names={one:'ワンオラクル',two:'二者択一',horo:'ホロスコープ',celtic:'ケルト十字'};
const mode=new URLSearchParams(location.search).get('m');
document.getElementById('title').textContent=names[mode]||'タロット占い';
document.getElementById('app').addEventListener('load',()=>{
  const w=document.getElementById('app').contentWindow;
  if(mode&&names[mode]&&typeof w.showMode==='function') w.showMode(mode);
});
</script>
</body>
</html>
