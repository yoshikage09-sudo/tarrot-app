<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>統合タロット占いアプリ - ケルト十字コピー修正版</title>
<meta name="theme-color" content="#120d18" />
<style>
:root{
  --bg:#0b0911;--panel:rgba(31,24,43,.88);--panel2:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);
  --gold:#d8b45f;--gold2:#fff0a8;--text:#f8f3ff;--muted:#cfc3df;--accent:#8e6bd8;--green:#88d6ad;--red:#d66b8f;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;color:var(--text)}
body{padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);background:radial-gradient(circle at 16% 4%,rgba(142,107,216,.32),transparent 30%),radial-gradient(circle at 86% 18%,rgba(216,180,95,.22),transparent 26%),linear-gradient(180deg,#120d18 0%,#09070d 100%)}
.app{max-width:1120px;margin:0 auto;padding:18px 0 32px}.hidden{display:none!important}
header{text-align:center;margin:6px 0 18px}.kicker{letter-spacing:.22em;color:#d9ccff;font-size:12px;margin-bottom:6px}h1{font-size:28px;margin:0 0 8px;line-height:1.3}.lead{max-width:820px;margin:0 auto;color:var(--muted);line-height:1.75;font-size:14px}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.055));border:1px solid rgba(216,180,95,.24);border-radius:22px;padding:18px;box-shadow:0 18px 52px rgba(0,0,0,.3);margin:14px 0;backdrop-filter:blur(10px)}
.home-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.home-card{min-height:190px;text-align:left;border-radius:22px;padding:18px;background:rgba(20,15,26,.72);border:1px solid rgba(216,180,95,.25);color:var(--text);cursor:pointer;box-shadow:0 14px 30px rgba(0,0,0,.22)}.home-card:hover{transform:translateY(-2px);filter:brightness(1.08)}.home-card .icon{font-size:34px}.home-card h2{margin:10px 0 8px;font-size:20px;color:#fff6d8}.home-card p{margin:0;color:var(--muted);line-height:1.65;font-size:14px}
label{display:block;font-weight:800;color:#fff6d8;margin:0 0 8px}textarea,input,select{width:100%;border:1px solid rgba(216,180,95,.32);border-radius:14px;background:#120e18;color:var(--text);padding:13px 14px;font-size:16px;outline:none}textarea{min-height:88px;resize:vertical}textarea::placeholder,input::placeholder{color:#9f93ad}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.button-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}button{appearance:none;border:0;border-radius:999px;padding:12px 18px;font-weight:900;color:#160f1f;background:linear-gradient(135deg,#f1d98b,#c99b3f);cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.25)}button.secondary{color:var(--text);background:#3a2a4c;border:1px solid rgba(216,180,95,.25)}button.ghost{background:transparent;color:#fff6d8;border:1px solid rgba(216,180,95,.32);box-shadow:none}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.topbar h2{margin:0;font-size:22px;color:#fff6d8}.small{color:var(--muted);font-size:13px;line-height:1.7}.section-title{text-align:center;font-weight:900;color:#fff6d8;margin:4px 0 10px}.status{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.status-box{background:rgba(20,15,26,.72);border:1px solid rgba(216,180,95,.22);border-radius:16px;padding:12px;line-height:1.6}.status-box strong{color:#ffecb0}.mode{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0 14px}.mode button{background:#3a2a4c;color:var(--text);border:1px solid rgba(216,180,95,.25)}.mode button.active{background:linear-gradient(135deg,#f1d98b,#c99b3f);color:#160f1f}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px}.card-back{height:118px;border-radius:13px;background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.14),transparent 18%),linear-gradient(145deg,#382650,#181020 58%,#3b2a50);border:2px solid rgba(216,180,95,.78);box-shadow:0 10px 22px rgba(0,0,0,.3);cursor:pointer;position:relative;overflow:hidden}.card-back:before{content:"";position:absolute;inset:8px;border:1px solid rgba(216,180,95,.45);border-radius:9px}.card-back:after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);font-size:28px}.card-back.used{opacity:.35;pointer-events:none;transform:scale(.96)}.card-back.revealed:after,.card-back.revealed:before{display:none}.card-back.revealed{background:linear-gradient(145deg,#f8ecd0,#b8934b);color:#21172b;display:grid;place-items:center;text-align:center;padding:7px}.card-back .front{display:none}.card-back.revealed .front{display:block}.card-back.selected-a{border-color:var(--green);box-shadow:0 0 0 3px rgba(136,214,173,.25),0 10px 22px rgba(0,0,0,.3)}.card-back.selected-b{border-color:var(--red);box-shadow:0 0 0 3px rgba(214,107,143,.25),0 10px 22px rgba(0,0,0,.3)}.badge{position:absolute;top:5px;left:5px;border-radius:999px;padding:2px 6px;font-size:11px;font-weight:900;color:#140f1a;z-index:2}.selected-a .badge{background:var(--green)}.selected-b .badge{background:var(--red)}.mini-icon{font-size:27px;line-height:1}.mini-name{font-size:11px;font-weight:900;line-height:1.2;margin-top:4px}.mini-ori{font-size:10px;font-weight:900;color:#4c365e;margin-top:3px}.chosen-card{margin:0 auto 18px;width:190px;min-height:285px;border-radius:18px;background:linear-gradient(145deg,#241a3e,#6a4c89);border:2px solid #d6b45f;display:grid;place-items:center;box-shadow:0 12px 34px rgba(0,0,0,.48);padding:18px;text-align:center}.chosen-card .big{font-size:28px;line-height:1.5}.reading{background:rgba(20,15,26,.76);border:1px solid rgba(216,180,95,.23);border-radius:18px;padding:16px;line-height:1.85;font-size:15px}.reading h2{margin:0 0 8px;font-size:20px;color:#ffecb0}.reading h3{margin:18px 0 4px;color:#fff6d8;font-size:16px}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.verdict,.summary{background:rgba(216,180,95,.12);border:1px solid rgba(216,180,95,.28);border-radius:18px;padding:16px;margin-top:14px;line-height:1.85}.counter{text-align:center;color:#fde68a;font-size:13px;margin:8px 0}.spread-wrap{overflow:auto;padding:8px 0}.spread{position:relative;width:min(94vw,560px);height:min(94vw,560px);max-width:560px;max-height:560px;margin:0 auto}.slot{position:absolute;width:74px;min-height:112px;border-radius:13px;background:#ffffff12;border:1px solid #ffffff26;text-align:center;padding:6px;transform:translate(-50%,-50%);box-shadow:0 12px 20px #0007}.slot.center{width:94px;min-height:132px;background:#fef3c7;color:#111827;border:2px solid #facc15}.slot-card{height:78px;border-radius:9px;background:linear-gradient(160deg,#fef3c7,#8b5cf6 58%,#111827);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#111827;font-weight:900;border:1px solid #ffffff88;margin-bottom:5px;position:relative;overflow:hidden}.slot-card.rev{transform:rotate(180deg)}.slot-card .sym{font-size:24px;line-height:1}.slot-card .mini{font-size:10px;line-height:1.1;margin-top:4px;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot.center .slot-card{height:92px}.slot-label{font-size:10px;color:#c7d2fe;line-height:1.2}.center .slot-label{color:#6b21a8}.slot-name{font-size:11px;font-weight:800;line-height:1.2}.slot-pos{font-size:10px;color:#fde68a}.center .slot-pos{color:#92400e}.reading-item{background:#ffffff10;border:1px solid #ffffff20;border-radius:16px;padding:13px;margin:10px 0;line-height:1.7}.tag{display:inline-block;font-size:12px;color:#111827;background:#fef3c7;border-radius:999px;padding:2px 8px;margin:0 6px 6px 0}

.celtic-intro{text-align:center;font-size:16px;line-height:1.9;color:#fff6d8;background:rgba(216,180,95,.10);border:1px solid rgba(216,180,95,.28);border-radius:18px;padding:16px;margin-bottom:14px}.celtic-spread{position:relative;width:min(96vw,820px);height:min(116vw,620px);max-width:820px;max-height:620px;margin:0 auto}.celtic-slot{position:absolute;width:96px;min-height:142px;border-radius:14px;background:#ffffff12;border:1px solid #ffffff26;text-align:center;padding:7px;transform:translate(-50%,-50%);box-shadow:0 12px 20px #0007}.celtic-slot.crossing{transform:translate(-50%,-50%) rotate(90deg)}.celtic-slot.crossing .slot-card{transform:rotate(-90deg)}.celtic-slot.crossing .slot-card.rev{transform:rotate(90deg)}.celtic-slot .slot-card{height:88px}.celtic-slot .slot-label{font-size:10px;color:#c7d2fe;line-height:1.25}.celtic-slot .slot-name{font-size:11px;font-weight:900;line-height:1.25}.celtic-slot .slot-pos{font-size:10px;color:#fde68a}.copy-box{width:100%;min-height:170px;margin-top:12px;font-size:13px;line-height:1.65}.toast{display:inline-block;margin-left:8px;color:#88d6ad;font-weight:900}.selected-number{position:absolute;top:5px;right:5px;border-radius:999px;background:#fef3c7;color:#21172b;font-size:11px;font-weight:900;padding:2px 7px;z-index:2}
@media(max-width:780px){.home-grid{grid-template-columns:1fr 1fr}.celtic-spread{height:720px}.celtic-slot{width:74px;min-height:120px}.celtic-slot .slot-card{height:72px}}
@media(max-width:430px){.home-grid{grid-template-columns:1fr}.celtic-spread{height:640px}.celtic-slot{width:62px;min-height:108px;padding:5px}.celtic-slot .slot-card{height:64px}.celtic-slot .slot-name{font-size:10px}.celtic-slot .slot-label{font-size:9px}}

@media(max-width:780px){.row,.status,.result-grid{grid-template-columns:1fr}.deck{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}.card-back{height:104px}.topbar{align-items:flex-start;flex-direction:column}.button-row{justify-content:flex-start}}
@media(max-width:430px){body{padding-left:10px;padding-right:10px}h1{font-size:24px}.slot{width:60px;min-height:98px;padding:5px}.slot.center{width:78px;min-height:116px}.slot-card{height:66px}.slot.center .slot-card{height:78px}.slot-card .mini{font-size:9px;max-width:50px}.slot-label{font-size:9px}.slot-name{font-size:10px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="kicker">TAROT READING APP</div>
  <h1>統合タロット占いアプリ</h1><p class="small" style="text-align:center;margin:4px 0 0">ケルト十字コピー修正版 v2</p>
  <p class="lead">最初に占いの種類を選んでください。ワンオラクルとケルト十字は、占いたい内容を心に留めて先にカードを選び、その後で質問を入力します。二者択一とホロスコープも1つにまとめています。</p>
</header>

<section id="home" class="panel">
  <div class="home-grid">
    <button class="home-card" onclick="showMode('one')"><div class="icon">🔮</div><h2>ワンオラクル</h2><p>1枚のカードで、今のテーマ・流れ・注意点を長文で読みます。</p></button>
    <button class="home-card" onclick="showMode('two')"><div class="icon">⚖️</div><h2>二者択一</h2><p>AとBの選択肢に1枚ずつカードを引き、どちらが良い流れか比較します。</p></button>
    <button class="home-card" onclick="showMode('horo')"><div class="icon">🌙</div><h2>ホロスコープ</h2><p>12枚を円形、中央に1枚。12ヶ月または12ハウスの流れを読みます。</p></button>
    <button class="home-card" onclick="showMode('celtic')"><div class="icon">✚</div><h2>ケルト十字</h2><p>占いたい内容を心に思い浮かべ、10枚を自分で選んで展開します。</p></button>
  </div>
</section>

<section id="one" class="hidden"></section>
<section id="two" class="hidden"></section>
<section id="horo" class="hidden"></section>
<section id="celtic" class="hidden"></section>
</div>
<script>
const TAROT=[
{n:"愚者",s:"🃏",cat:"start",u:"新しい始まり、自由、未知への一歩。まだ形は固まっていませんが、可能性は大きく広がっています。",r:"準備不足、軽率さ、見通しの甘さ。勢いだけで進むと、後から調整が必要になります。",advU:"完璧を待つより、まず小さく試すことが運を開きます。",advR:"今は勢いより確認です。条件、期限、相手の反応を一度整理してください。"},
{n:"魔術師",s:"✴",cat:"action",u:"行動力、創造力、実現力。必要な材料や能力はすでに揃いつつあります。",r:"力をうまく使えていない状態。準備不足、説明不足、または空回りに注意です。",advU:"自分から提案し、主導権を取ると流れが良くなります。",advR:"道具や情報を揃えてから動くと、空回りを防げます。"},
{n:"女教皇",s:"☾",cat:"mind",u:"直感、知性、静かな判断。表に出ている情報より、違和感や予感が大切です。",r:"考えすぎ、不安、情報不足。直感と不安が混ざり、判断が曇りやすいです。",advU:"すぐ結論を出さず、観察と情報収集を優先してください。",advR:"思い込みで判断せず、事実確認を増やしてください。"},
{n:"女帝",s:"🌿",cat:"growth",u:"豊かさ、成長、魅力。手をかけたものが育ち、印象も良くなりやすいです。",r:"甘え、停滞、過剰な期待。良い素材はありますが、放置すると伸びきりません。",advU:"見た目や雰囲気を整えるほど、成果に結びつきます。",advR:"甘く見ている部分に手を入れると一気に改善します。"},
{n:"皇帝",s:"♜",cat:"stable",u:"安定、責任、現実的な勝ち筋。軸を決めるほど強くなります。",r:"頑固、圧力、柔軟性不足。正しさを押し通すほど反発を招きやすいです。",advU:"基準や条件を明確にして、ぶれずに進めてください。",advR:"譲れる点と譲れない点を分けると、衝突を減らせます。"},
{n:"教皇",s:"♙",cat:"trust",u:"信頼、助言、正攻法。経験者や専門家の意見が助けになります。",r:"形式への縛り、古いやり方への違和感。常識に寄せすぎると本質を見失います。",advU:"信頼できる人に相談し、標準的な手順を踏むと安全です。",advR:"一般論を鵜呑みにせず、自分の状況に合うか確認してください。"},
{n:"恋人",s:"♡",cat:"choice",u:"選択、調和、納得感。気持ちと条件が噛み合うと良い流れになります。",r:"迷い、不一致、優柔不断。気持ちと条件が噛み合っていない可能性があります。",advU:"損得だけでなく、納得できるかを基準にしてください。",advR:"選択肢を減らし、最も大事な条件を一つ決めてください。"},
{n:"戦車",s:"⚔",cat:"move",u:"前進、勝負、突破力。勢いを使って状況を押し出せる時です。",r:"焦り、暴走、方向違い。急ぎすぎると本来の目的から外れます。",advU:"短期決戦で動くと成果が出やすいです。",advR:"一度ブレーキを踏み、勝ち筋を確認してから動いてください。"},
{n:"力",s:"♌",cat:"patience",u:"粘り、信頼、内面の強さ。強引さよりも丁寧な対応が効きます。",r:"自信不足、消耗、不安。内側の疲れが判断に影響しやすいです。",advU:"相手や状況をねじ伏せず、時間をかけて慣らしてください。",advR:"無理に耐え続けず、休む・助けを借りる判断も必要です。"},
{n:"隠者",s:"☌",cat:"analysis",u:"熟考、専門性、静かな答え。深く調べるほど正しい道が見えます。",r:"孤立、考えすぎ、遅れ。検討ばかりで動きが止まりやすいです。",advU:"データや過去の事例を見直すと、正しい判断に近づきます。",advR:"考える期限を決め、外の意見も入れてください。"},
{n:"運命の輪",s:"◎",cat:"change",u:"転機、好機、タイミング。予想外のきっかけで状況が動きます。",r:"タイミング違い、停滞、予測不能。今は無理に押すほど噛み合いません。",advU:"チャンスが来たら素早く反応してください。",advR:"今動かないなら、次の波に備える準備へ切り替えてください。"},
{n:"正義",s:"⚖",cat:"judge",u:"公平、契約、妥当な判断。数字や条件を冷静に比べるほど答えに近づきます。",r:"不均衡、条件の見落とし、判断ミス。感情や先入観で結論を出しやすいです。",advU:"条件を紙に書き出し、客観的に比較してください。",advR:"契約、金額、期限、約束事は特に慎重に確認してください。"},
{n:"吊るされた男",s:"☍",cat:"wait",u:"待つ価値、視点転換、忍耐。すぐ動かないことで見えてくるものがあります。",r:"報われにくい我慢、停滞、犠牲感。待つ理由が曖昧なら見直しが必要です。",advU:"今は視点を変え、別角度から打開策を探してください。",advR:"ただ耐えるだけになっていないか確認してください。"},
{n:"死神",s:"♱",cat:"end",u:"区切り、変化、再出発。古い形を終えることで新しい流れが始まります。",r:"未練、変化への抵抗、先延ばし。終わらせるべきものを引きずっています。",advU:"不要な条件や古い方針を思い切って手放してください。",advR:"先延ばししている決断を一つだけでも片付けてください。"},
{n:"節制",s:"♒",cat:"balance",u:"調整、バランス、穏やかな改善。無理なく整えることで安定します。",r:"中途半端、不調和、ペースの乱れ。調整不足が表に出ています。",advU:"急変より微調整が効果的です。",advR:"生活、予算、時間配分のどこかを整える必要があります。"},
{n:"悪魔",s:"♑",cat:"bind",u:"執着、誘惑、魅力ある罠。強く惹かれる分、隠れたコストもあります。",r:"依存からの解放、悪循環の断ち切り。しがらみを断つチャンスです。",advU:"欲や不安で判断していないか見直してください。",advR:"手放すほど身軽になり、判断がクリアになります。"},
{n:"塔",s:"⚡",cat:"shock",u:"急変、破壊、想定外。前提が崩れることで再構築が必要になります。",r:"崩壊回避、小さな崩れ、警告。大崩れ前に修正できる段階です。",advU:"壊れたものを守るより、作り直す判断が必要です。",advR:"小さな違和感のうちに修正してください。"},
{n:"星",s:"✧",cat:"hope",u:"希望、回復、未来の可能性。すぐ完成しなくても良い方向へ向かいます。",r:"期待先行、現実感不足、不安。理想と現実の距離が気になりやすいです。",advU:"長期目標を信じて、焦らず育ててください。",advR:"理想を少し具体的な行動に落とし込んでください。"},
{n:"月",s:"☽",cat:"unclear",u:"不安、曖昧さ、見えない要素。情報が不完全で思い込みが強くなりやすい時です。",r:"誤解が晴れる、真実が見える。少しずつ状況の正体が見え始めています。",advU:"不確かな情報で大きな決断をしないでください。",advR:"見えてきた事実をもとに、判断を更新してください。"},
{n:"太陽",s:"☀",cat:"success",u:"成功、明るい結果、満足。評価や協力も得やすい前向きなカードです。",r:"成功はあるが遅い、詰めの甘さ、過信。悪くはありませんが油断は禁物です。",advU:"堂々と見せることで評価されます。",advR:"最後の確認と細部の調整を怠らないでください。"},
{n:"審判",s:"✺",cat:"call",u:"再評価、復活、決断の時。過去の積み重ねが次の判断につながります。",r:"決断遅れ、過去への未練、チャンスを逃す不安。答えを先送りしがちです。",advU:"返事、申請、相談など、呼びかける行動が効果的です。",advR:"過去の失敗から学び、同じ形を繰り返さないでください。"},

function esc(s){return String(s||"").replace(/[&<>'"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[m]))}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function drawnDeck(){return shuffle(TAROT).map((c,i)=>({...c,id:i,rev:Math.random()<0.45}))}
function cardHTML(c,badgeClass='',badge=''){return `<div class="front">${badge?`<span class="badge">${badge}</span>`:''}<div class="mini-icon">${c.s}</div><div class="mini-name">${c.n}</div><div class="mini-ori">${c.rev?'逆位置':'正位置'}</div></div>`}
function textOf(c){return c.rev?c.r:c.u}function advOf(c){return c.rev?c.advR:c.advU}

function oneReading(q,c){return `<h2>選ばれたカード：${c.n}（${c.rev?'逆位置':'正位置'}）</h2><p><strong>占いたい内容：</strong>${esc(q)}</p><h3>全体の結論</h3><p>${esc(q)}については、「${textOf(c)}」という流れが出ています。このカードは単純な吉凶だけでなく、今の状況で何が強く働いているか、どこを整えると現実が動きやすいかを示しています。</p><h3>カードが示す今の流れ</h3><p>${textOf(c)} ${c.rev?'逆位置のため、カード本来の力が弱まっている、内側にこもっている、または使い方がずれている可能性があります。悪い結果と決めつけず、準備不足・タイミング・認識のずれを修正するサインとして読むのが現実的です。':'正位置のため、カードの意味は比較的素直に表れやすい状態です。ただし、良い流れでも確認や準備を省けば力を十分に活かせません。'}</p><h3>質問内容に対する読み</h3><p>今回の問いでは、目先の答えだけを求めるより、「${c.n}」が示すテーマを現実の条件に当てはめることが重要です。相手がいる問題なら相手の反応、仕事やお金なら期限・金額・条件、生活や人間関係なら自分の負担と継続可能性を分けて確認してください。</p><h3>注意点</h3><p>焦って結論だけを急ぐと、カードが示している細かなサインを見落としやすくなります。特に期待、不安、勢いのどれか一つに偏っていないかを見直してください。占いの結果を理由に現実の確認を省くことも避けた方が安全です。</p><h3>現実的な行動アドバイス</h3><p>${advOf(c)} 今回は全部を一気に変えるより、今見えている課題を一つだけ具体的な行動に落とし込む方が効果的です。小さく試す、期限を決める、必要な人に確認する、数字で比較する、といった形にするとカードの良い面を引き出しやすくなります。</p><h3>避けた方がいい判断</h3><p>この1枚だけで将来を確定したり、感情的に大きな決断を即断したりすることは避けてください。カードは現在の流れと注意点を示すものであり、現実の情報が変われば結果の出方も変わります。</p><h3>短くまとめると</h3><p>今回の中心テーマは「${c.n}」です。${advOf(c)} まず一つ具体的に整え、その反応を見て次へ進むのが良い流れです。</p>`}
function initOne(){oneSelected=null;oneQuestion='';oneReadingText='';document.getElementById('one').innerHTML=`<div class="topbar"><h2>🔮 ワンオラクル</h2><button class="ghost" onclick="backHome()">占い選択に戻る</button></div><section class="panel"><div class="celtic-intro">占いたい内容を心に留めてください。<br>まだ入力しなくて大丈夫です。気持ちを落ち着けて、直感でカードを1枚選びます。</div><p id="oneStatus" class="small" style="text-align:center;margin-top:12px">心の中でテーマを思い浮かべたら、カードを選んでください。</p></section><section class="panel"><div class="section-title">カードを1枚選んでください</div><div id="oneDeck" class="deck"></div></section><section id="oneReveal" class="panel hidden"><div id="oneChosenCard"></div><div class="panel" style="margin-top:16px"><label>占いたい内容</label><textarea id="oneQ" placeholder="例：本日内見に来た客は、うちの家を購入するでしょうか？"></textarea><div class="button-row"><button onclick="renderOneReading()">長文リーディングを表示する</button></div></div></section><section id="oneResult" class="panel hidden"><div id="oneReading" class="reading"></div><div class="verdict"><h2>GPTでさらに深掘りする文章</h2><p class="small">下の文章をChatGPTに貼り付けると、結果をさらに詳しく読めます。</p><textarea id="oneCopyText" class="copy-box" readonly></textarea><div class="button-row"><button type="button" onclick="copyOnePrompt()">GPT用文章をコピー</button><button type="button" class="secondary" onclick="selectOnePrompt()">文章を選択</button><button type="button" class="secondary" onclick="initOne()">もう一度占う</button></div><p id="oneCopyToast" class="small" style="text-align:center;color:#88d6ad;font-weight:900"></p></div></section>`;const deck=drawnDeck();const el=document.getElementById('oneDeck');deck.forEach(c=>{const b=document.createElement('button');b.className='card-back';b.onclick=()=>{oneSelected=c;document.querySelectorAll('#oneDeck .card-back').forEach(x=>x.disabled=true);b.className='card-back revealed used';b.innerHTML=cardHTML(c);document.getElementById('oneStatus').textContent='カードを選びました。続けて、占いたい内容を入力してください。';document.getElementById('oneReveal').classList.remove('hidden');document.getElementById('oneChosenCard').innerHTML=`<div class="chosen-card"><div class="big">${c.s}<br>${c.n}<br><span class="small">${c.rev?'逆位置':'正位置'}</span></div></div>`;document.getElementById('oneReveal').scrollIntoView({behavior:'smooth',block:'start'});};el.appendChild(b);});}

function makeOnePrompt(){if(!oneSelected)return '';return `以下はタロット占いアプリで出たワンオラクルの結果です。
この内容をもとに、かなり詳しく、現実的な行動アドバイスまで含めて日本語で深掘り解説してください。

function prepareOneCopyBox(){const box=document.getElementById('oneCopyText');const toast=document.getElementById('oneCopyToast');if(!box){alert('コピー用テキスト欄が見つかりません。ページを再読み込みしてください。');return null}box.value=makeOnePrompt();if(toast)toast.textContent='';return box}
function selectOnePrompt(){const box=prepareOneCopyBox();if(!box)return;box.removeAttribute('readonly');box.focus({preventScroll:false});box.select();box.setSelectionRange(0,box.value.length);box.setAttribute('readonly','readonly');const toast=document.getElementById('oneCopyToast');if(toast)toast.textContent='全文を選択しました。スマホなら選択範囲を長押ししてコピー、PCなら Ctrl/Cmd+C でコピーしてください。'}
function copyOnePrompt(){const box=prepareOneCopyBox();if(!box)return;box.removeAttribute('readonly');box.focus({preventScroll:false});box.select();box.setSelectionRange(0,box.value.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){ok=false}box.setAttribute('readonly','readonly');const toast=document.getElementById('oneCopyToast');if(ok){if(toast)toast.textContent='コピーしました。ChatGPTに貼り付けて深掘りできます。';return}if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(box.value).then(()=>{if(toast)toast.textContent='コピーしました。ChatGPTに貼り付けて深掘りできます。'}).catch(()=>{selectOnePrompt();if(toast)toast.textContent='自動コピーできませんでした。文章は全文選択しています。長押し→コピー、または Ctrl/Cmd+C でコピーしてください。'})}else{selectOnePrompt();if(toast)toast.textContent='自動コピーできませんでした。文章は全文選択しています。長押し→コピー、または Ctrl/Cmd+C でコピーしてください。'}}
let twoState;
function initTwo(){twoState={deck:drawnDeck(),mode:'A',A:null,B:null};document.getElementById('two').innerHTML=`<div class="topbar"><h2>⚖️ 二者択一</h2><button class="ghost" onclick="backHome()">占い選択に戻る</button></div><section class="panel"><label>占いたい内容</label><textarea id="twoQ" placeholder="例：今の価格で様子を見るか、価格改定するかで迷っている"></textarea><div class="row" style="margin-top:14px"><div><label>Aの選択肢</label><input id="choiceA" placeholder="例：今の価格で様子を見る"></div><div><label>Bの選択肢</label><input id="choiceB" placeholder="例：価格を少し下げる"></div></div><div class="status"><div class="status-box"><strong>A：</strong><span id="statusA">まだ選ばれていません</span></div><div class="status-box"><strong>B：</strong><span id="statusB">まだ選ばれていません</span></div></div><div class="button-row"><button onclick="initTwo()">最初からやり直す</button><button class="secondary" onclick="initTwo()">カードをシャッフル</button></div></section><section class="panel"><div class="section-title">カードを選ぶ</div><p class="small" style="text-align:center">現在の選択モード：<strong id="modeText">Aのカードを選ぶ</strong></p><div class="mode"><button id="modeA" class="active" onclick="setTwoMode('A')">Aを選ぶ</button><button id="modeB" onclick="setTwoMode('B')">Bを選ぶ</button></div><div id="twoDeck" class="deck"></div></section><section id="twoResult" class="panel hidden"></section>`;renderTwoDeck();}
function setTwoMode(m){twoState.mode=m;document.getElementById('modeA').classList.toggle('active',m==='A');document.getElementById('modeB').classList.toggle('active',m==='B');document.getElementById('modeText').textContent=m+'のカードを選ぶ'}
function renderTwoDeck(){const el=document.getElementById('twoDeck');el.innerHTML='';twoState.deck.forEach(c=>{const b=document.createElement('button');b.className='card-back';if(c.by){b.classList.add('revealed','used',c.by==='A'?'selected-a':'selected-b');b.innerHTML=cardHTML(c,'',c.by)}b.onclick=()=>pickTwo(c);el.appendChild(b);});}
function pickTwo(c){const q=document.getElementById('twoQ').value.trim();if(!q){alert('占いたい内容を入力してください。');return}const m=twoState.mode;if(twoState[m]){alert(m+'のカードはすでに選ばれています。');return}c.by=m;twoState[m]=c;document.getElementById('status'+m).textContent=`${c.n}（${c.rev?'逆位置':'正位置'}）`;if(m==='A'&&!twoState.B)setTwoMode('B');else if(m==='B'&&!twoState.A)setTwoMode('A');renderTwoDeck();if(twoState.A&&twoState.B)renderTwoResult();}
function sideReading(side,label,c){return `<h2>${side}：${esc(label)}</h2><p><strong>カード：</strong>${c.n}（${c.rev?'逆位置':'正位置'}）</p><h3>基本の流れ</h3><p>${esc(label)}には「${textOf(c)}」というテーマが出ています。これは単純な良し悪しではなく、この選択肢を選んだ時に何が起こりやすく、どこを整えれば結果が安定するかを示しています。</p><h3>メリット</h3><p>この選択肢の良さは、今の状況を動かすきっかけを作れる点です。正位置なら比較的スムーズに力が出やすく、逆位置なら課題に気づくことで修正の余地が生まれます。</p><h3>注意点</h3><p>目先の印象だけで判断すると、後から負担になる条件を見落としやすくなります。勢い、期待、不安のどれかに偏っていないかを確認してください。</p><h3>アドバイス</h3><p>${advOf(c)}</p>`}
function renderTwoResult(){const q=document.getElementById('twoQ').value.trim();const la=document.getElementById('choiceA').value.trim()||'Aの選択肢';const lb=document.getElementById('choiceB').value.trim()||'Bの選択肢';const a=twoState.A,b=twoState.B;let verdict='';const score=c=>(c.rev?0:2)+({success:3,complete:3,stable:2,balance:2,action:2,growth:2,hope:2,trust:1,judge:1,change:1,move:1,start:1,choice:1,patience:1,analysis:0,mind:0,wait:-1,unclear:-1,bind:-2,shock:-2,end:0,call:1}[c.cat]||0);if(score(a)>score(b))verdict=`総合的には、今はA「${esc(la)}」の方が流れに乗りやすい印象です。ただしBにも意味がないわけではなく、Bのカードが示す課題を整理してからなら再検討できます。`;else if(score(b)>score(a))verdict=`総合的には、今はB「${esc(lb)}」の方が現実を動かしやすい印象です。Aを選ぶ場合は、Aのカードが示す停滞や注意点を先に潰すことが大切です。`;else verdict=`AとBはかなり拮抗しています。今回はカードの強弱より、「どちらの注意点を自分が受け入れられるか」で決めると納得感が出やすいです。`;document.getElementById('twoResult').classList.remove('hidden');document.getElementById('twoResult').innerHTML=`<div class="result-grid"><div class="reading">${sideReading('A',la,a)}</div><div class="reading">${sideReading('B',lb,b)}</div></div><div class="verdict"><h2>総合判断</h2><p>占いたい内容：${esc(q)}</p><p>${verdict}</p><p>最終的には、カードの結果を現実の条件と合わせて見るのが安全です。金額、期限、相手の反応、リスク許容度を並べると、どちらを選ぶべきかがよりはっきりします。</p></div>`;}
let horoDeck=[],horoSelected=[];
function initHoro(){document.getElementById('horo').innerHTML=`<div class="topbar"><h2>🌙 ホロスコープスプレッド</h2><button class="ghost" onclick="backHome()">占い選択に戻る</button></div><section class="panel"><label>占いたい内容</label><textarea id="horoQ" placeholder="例：この1年の流れを知りたい／マンション売却の今後を見たい"></textarea><div class="row" style="margin-top:10px"><div><label>読み方</label><select id="horoMode"><option value="months">12ヶ月の流れとして読む</option><option value="houses">12ハウスとして読む</option></select></div><div><label>開始月</label><select id="startMonth"></select></div></div><div class="button-row"><button onclick="prepareHoro()">カードをシャッフル</button><button class="secondary" onclick="initHoro()">リセット</button></div><div id="horoStatus" class="small" style="margin-top:10px">まず「カードをシャッフル」を押してください。</div></section><section id="horoDeckPanel" class="panel hidden"><div class="section-title">カードを13枚選んでください</div><div id="horoCounter" class="counter">0 / 13</div><div id="horoDeck" class="deck"></div></section><section id="spreadPanel" class="panel hidden"><div class="section-title">展開結果</div><div class="spread-wrap"><div id="spread" class="spread"></div></div></section><section id="readingPanel" class="hidden"><div id="summary" class="summary"></div><div id="horoReading" class="reading"></div></section>`;const sel=document.getElementById('startMonth');const now=new Date();monthNames.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=m+'から開始';if(i===now.getMonth())o.selected=true;sel.appendChild(o)});document.getElementById('horoMode').onchange=()=>{document.getElementById('startMonth').disabled=document.getElementById('horoMode').value==='houses'};}

  {label:'5. 過去',meaning:'この状況に影響している直近または過去の流れです。'},
  {label:'6. 近未来',meaning:'このまま進んだ場合、近い時期に現れやすい展開です。'},
  {label:'7. 自分の立場',meaning:'あなた自身の姿勢、取るべき態度、現在のコンディションです。'},
  {label:'8. 周囲・環境',meaning:'相手、関係者、市場、周囲の条件など外側から働く力です。'},
  {label:'9. 期待と不安',meaning:'望んでいることと怖れていること。判断を揺らす心理的な要素です。'},
  {label:'10. 最終結果',meaning:'この流れが向かいやすい着地点。確定未来ではなく、今の流れの結論です。'}
];
function initCeltic(){celticDeck=[];celticSelected=[];celticQuestion='';celticReadingText='';document.getElementById('celtic').innerHTML=`<div class="topbar"><h2>✚ ケルト十字</h2><button class="ghost" onclick="backHome()">占い選択に戻る</button></div><section class="panel"><div class="celtic-intro">占いたい内容をココロに思い浮かべてください。<br>まだ入力しなくて大丈夫です。まずカードをシャッフルし、自分で10枚選びます。</div><div class="button-row"><button onclick="prepareCeltic()">カードをシャッフルする</button><button class="secondary" onclick="initCeltic()">リセット</button></div><p id="celticStatus" class="small" style="text-align:center;margin-top:12px">準備ができたらシャッフルしてください。</p></section><section id="celticDeckPanel" class="panel hidden"><div class="section-title">10枚のカードを選んでください</div><div id="celticCounter" class="counter">0 / 10</div><div id="celticDeck" class="deck"></div></section><section id="celticSpreadPanel" class="panel hidden"><div class="section-title">選んだ場所でカードを開示しました</div><div class="spread-wrap"><div id="celticSpread" class="celtic-spread"></div></div><div id="celticQuestionPanel" class="panel" style="margin-top:16px"><label>占いたい内容</label><textarea id="celticQ" placeholder="例：今のマンション売却はこのまま待つべきか、価格や仲介戦略を変えるべきか？"></textarea><div class="button-row"><button onclick="renderCelticReading()">長文リーディングを表示する</button></div></div></section><section id="celticReadingPanel" class="panel hidden"><div id="celticReading" class="reading"></div><div class="verdict"><h2>GPTでさらに深掘りする文章</h2><p class="small">下の文章をChatGPTに貼り付けると、結果をさらに詳しく読めます。</p><textarea id="celticCopyText" class="copy-box" readonly></textarea><div class="button-row"><button type="button" onclick="copyCelticPrompt()">GPT用文章をコピー</button><button type="button" class="secondary" onclick="selectCelticPrompt()">文章を選択</button><button type="button" class="secondary" onclick="initCeltic()">もう一度占う</button></div><p id="copyToast" class="small" style="text-align:center;color:#88d6ad;font-weight:900"></p></div></section>`;}
function prepareCeltic(){celticDeck=drawnDeck();celticSelected=[];document.getElementById('celticDeckPanel').classList.remove('hidden');document.getElementById('celticSpreadPanel').classList.add('hidden');document.getElementById('celticReadingPanel').classList.add('hidden');document.getElementById('celticStatus').textContent='心の中でテーマを保ったまま、10枚選んでください。選ぶたびにその場で開示されます。';renderCelticDeck();}
function renderCelticDeck(){const el=document.getElementById('celticDeck');el.innerHTML='';celticDeck.forEach(c=>{const used=celticSelected.includes(c);const b=document.createElement('button');b.className='card-back'+(used?' revealed used':'');b.disabled=used||celticSelected.length>=10;if(used){const idx=celticSelected.indexOf(c)+1;b.innerHTML=`<span class="selected-number">${idx}</span>`+cardHTML(c);}b.onclick=()=>{celticSelected.push(c);renderCelticDeck();document.getElementById('celticStatus').textContent=celticSelected.length<10?`${10-celticSelected.length}枚選んでください。`:'10枚選び終わりました。展開結果を開示しました。';if(celticSelected.length===10){renderCelticSpread();}};el.appendChild(b);});document.getElementById('celticCounter').textContent=celticSelected.length+' / 10';}
function renderCelticSpread(){document.getElementById('celticSpreadPanel').classList.remove('hidden');const sp=document.getElementById('celticSpread');sp.innerHTML='';const w=sp.clientWidth||820,h=sp.clientHeight||620;const coords=[
  [.36,.48,false],[.36,.48,true],[.36,.24,false],[.36,.73,false],[.20,.48,false],[.53,.48,false],[.73,.78,false],[.73,.58,false],[.73,.38,false],[.73,.18,false]
];celticSelected.forEach((c,i)=>{const [px,py,cross]=coords[i];sp.appendChild(celticSlot(c,celticPositions[i].label,w*px,h*py,cross));});}
function celticSlot(c,label,x,y,cross){const d=document.createElement('div');d.className='celtic-slot'+(cross?' crossing':'');d.style.left=x+'px';d.style.top=y+'px';d.innerHTML=`<div class="slot-card ${c.rev?'rev':''}"><div class="sym">${c.s}</div><div class="mini">${c.n}</div></div><div class="slot-label">${esc(label)}</div><div class="slot-name">${c.n}</div><div class="slot-pos">${c.rev?'逆位置':'正位置'}</div>`;return d;}
function celticTone(c){const t=textOf(c);const a=advOf(c);return `「${t}」という示し方です。ここでは、${a}`;}
function renderCelticReading(){const q=document.getElementById('celticQ').value.trim();if(!q){alert('占いたい内容を入力してください。');return}celticQuestion=q;const final=celticSelected[9];const near=celticSelected[5];const block=celticSelected[1];let html=`<h2>ケルト十字リーディング</h2><p><strong>占いたい内容：</strong>${esc(q)}</p><h3>全体の結論</h3><p>今回のケルト十字は、まず「${celticSelected[0].n}」が現在地を示し、最終結果に「${final.n}（${final.rev?'逆位置':'正位置'}）」が出ています。結論としては、今の状況は一気に決め打ちするより、障害として出た「${block.n}」をどう扱うかで流れがかなり変わります。近未来の「${near.n}」は、このまま進めた時に最初に表面化しやすい出来事を示しています。</p>`;
html+=celticSelected.map((c,i)=>`<div class="reading-item"><h3>${esc(celticPositions[i].label)}：${c.n}（${c.rev?'逆位置':'正位置'}）</h3><p class="small"><strong>位置の意味：</strong>${esc(celticPositions[i].meaning)}</p><p>${celticTone(c)}</p></div>`).join('');
html+=`<h3>現実的な行動アドバイス</h3><p>この結果では、最終結果だけを見て楽観・悲観するより、1枚目の現在、2枚目の障害、6枚目の近未来、10枚目の最終結果をセットで見るのが重要です。まず障害として出た「${block.n}」の注意点を潰し、そのうえで近未来の「${near.n}」が示す流れに備えてください。現実の判断では、感情だけではなく、期限・金額・相手の反応・自分が許容できるリスクを分けて確認すると読みが実用的になります。</p><h3>避けた方がいい判断</h3><p>カードの結果だけで大きな決断を固定することは避けてください。特に逆位置が多い場合は、未来が悪いというより、準備不足・認識違い・タイミングのズレがあるサインとして扱う方が安全です。正位置が多い場合も、良い流れに油断して確認を省くと弱点が残ります。</p><h3>短くまとめると</h3><p>今のテーマは「${final.n}」へ向かっています。ただし鍵を握るのは「${block.n}」への対処です。焦って結論を急ぐより、障害をひとつ具体的に処理してから次の行動へ進むのがよい流れです。</p>`;
document.getElementById('celticReadingPanel').classList.remove('hidden');document.getElementById('celticReading').innerHTML=html;celticReadingText=document.getElementById('celticReading').innerText;document.getElementById('celticCopyText').value=makeCelticPrompt();document.getElementById('celticReadingPanel').scrollIntoView({behavior:'smooth',block:'start'});}
function makeCelticPrompt(){const lines=celticSelected.map((c,i)=>`${celticPositions[i].label}：${c.n}（${c.rev?'逆位置':'正位置'}）`).join('\n');return `以下はタロット占いアプリで出たケルト十字の結果です。\nこの内容をもとに、かなり詳しく、現実的な行動アドバイスまで含めて日本語で深掘り解説してください。\n\n【占いの種類】\nケルト十字\n\n【占いたい内容】\n${celticQuestion}\n\n【出たカード】\n${lines}\n\n【アプリ内リーディング】\n${celticReadingText}\n\n【解説してほしいこと】\n・全体の結論\n・カードごとの意味\n・正位置/逆位置を踏まえた注意点\n・質問内容に対してどう読めるか\n・現実的にどう行動すべきか\n・避けた方がいい判断\n・最後に短くまとめたアドバイス`;}
function prepareCelticCopyBox(){
  const box=document.getElementById('celticCopyText');
  const toast=document.getElementById('copyToast');
  if(!box){ alert('コピー用テキスト欄が見つかりません。ページを再読み込みしてください。'); return null; }
  const text=makeCelticPrompt();
  box.value=text;
  if(toast) toast.textContent='';
  return box;
}
function selectCelticPrompt(){
  const box=prepareCelticCopyBox();
  if(!box) return;
  box.removeAttribute('readonly');
  box.focus({preventScroll:false});
  box.select();
  box.setSelectionRange(0, box.value.length);
  box.setAttribute('readonly','readonly');
  const toast=document.getElementById('copyToast');
  if(toast) toast.textContent='全文を選択しました。スマホなら選択範囲を長押ししてコピー、PCなら Ctrl/Cmd+C でコピーしてください。';
}
function copyCelticPrompt(){
  const box=prepareCelticCopyBox();
  if(!box) return;
  box.removeAttribute('readonly');
  box.focus({preventScroll:false});
  box.select();
  box.setSelectionRange(0, box.value.length);
  let ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
  box.setAttribute('readonly','readonly');
  const toast=document.getElementById('copyToast');
  if(ok){
    if(toast) toast.textContent='コピーしました。ChatGPTに貼り付けて深掘りできます。';
    return;
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(box.value).then(()=>{
      if(toast) toast.textContent='コピーしました。ChatGPTに貼り付けて深掘りできます。';
    }).catch(()=>{
      selectCelticPrompt();
      if(toast) toast.textContent='自動コピーできませんでした。文章は全文選択しています。長押し→コピー、または Ctrl/Cmd+C でコピーしてください。';
    });
  }else{
    selectCelticPrompt();
    if(toast) toast.textContent='自動コピーできませんでした。文章は全文選択しています。長押し→コピー、または Ctrl/Cmd+C でコピーしてください。';
  }
}
</script>
