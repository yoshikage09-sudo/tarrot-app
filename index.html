<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>統合タロット占いアプリ</title>
<meta name="theme-color" content="#120d18" />
<style>
:root{
  --bg:#0b0911;--panel:rgba(31,24,43,.88);--panel2:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);
  --gold:#d8b45f;--gold2:#fff0a8;--text:#f8f3ff;--muted:#cfc3df;--accent:#8e6bd8;--green:#88d6ad;--red:#d66b8f;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;color:var(--text)}
body{padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);background:radial-gradient(circle at 16% 4%,rgba(142,107,216,.32),transparent 30%),radial-gradient(circle at 86% 18%,rgba(216,180,95,.22),transparent 26%),linear-gradient(180deg,#120d18 0%,#09070d 100%)}
.app{max-width:1120px;margin:0 auto;padding:18px 0 32px}.hidden{display:none!important}
header{text-align:center;margin:6px 0 18px}.kicker{letter-spacing:.22em;color:#d9ccff;font-size:12px;margin-bottom:6px}h1{font-size:28px;margin:0 0 8px;line-height:1.3}.lead{max-width:820px;margin:0 auto;color:var(--muted);line-height:1.75;font-size:14px}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.055));border:1px solid rgba(216,180,95,.24);border-radius:22px;padding:18px;box-shadow:0 18px 52px rgba(0,0,0,.3);margin:14px 0;backdrop-filter:blur(10px)}
.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.home-card{min-height:190px;text-align:left;border-radius:22px;padding:18px;background:rgba(20,15,26,.72);border:1px solid rgba(216,180,95,.25);color:var(--text);cursor:pointer;box-shadow:0 14px 30px rgba(0,0,0,.22)}.home-card:hover{transform:translateY(-2px);filter:brightness(1.08)}.home-card .icon{font-size:34px}.home-card h2{margin:10px 0 8px;font-size:20px;color:#fff6d8}.home-card p{margin:0;color:var(--muted);line-height:1.65;font-size:14px}
label{display:block;font-weight:800;color:#fff6d8;margin:0 0 8px}textarea,input,select{width:100%;border:1px solid rgba(216,180,95,.32);border-radius:14px;background:#120e18;color:var(--text);padding:13px 14px;font-size:16px;outline:none}textarea{min-height:88px;resize:vertical}textarea::placeholder,input::placeholder{color:#9f93ad}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.button-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}button{appearance:none;border:0;border-radius:999px;padding:12px 18px;font-weight:900;color:#160f1f;background:linear-gradient(135deg,#f1d98b,#c99b3f);cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.25)}button.secondary{color:var(--text);background:#3a2a4c;border:1px solid rgba(216,180,95,.25)}button.ghost{background:transparent;color:#fff6d8;border:1px solid rgba(216,180,95,.32);box-shadow:none}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.topbar h2{margin:0;font-size:22px;color:#fff6d8}.small{color:var(--muted);font-size:13px;line-height:1.7}.section-title{text-align:center;font-weight:900;color:#fff6d8;margin:4px 0 10px}.status{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.status-box{background:rgba(20,15,26,.72);border:1px solid rgba(216,180,95,.22);border-radius:16px;padding:12px;line-height:1.6}.status-box strong{color:#ffecb0}.mode{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0 14px}.mode button{background:#3a2a4c;color:var(--text);border:1px solid rgba(216,180,95,.25)}.mode button.active{background:linear-gradient(135deg,#f1d98b,#c99b3f);color:#160f1f}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px}.card-back{height:118px;border-radius:13px;background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.14),transparent 18%),linear-gradient(145deg,#382650,#181020 58%,#3b2a50);border:2px solid rgba(216,180,95,.78);box-shadow:0 10px 22px rgba(0,0,0,.3);cursor:pointer;position:relative;overflow:hidden}.card-back:before{content:"";position:absolute;inset:8px;border:1px solid rgba(216,180,95,.45);border-radius:9px}.card-back:after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);font-size:28px}.card-back.used{opacity:.35;pointer-events:none;transform:scale(.96)}.card-back.revealed:after,.card-back.revealed:before{display:none}.card-back.revealed{background:linear-gradient(145deg,#f8ecd0,#b8934b);color:#21172b;display:grid;place-items:center;text-align:center;padding:7px}.card-back .front{display:none}.card-back.revealed .front{display:block}.card-back.selected-a{border-color:var(--green);box-shadow:0 0 0 3px rgba(136,214,173,.25),0 10px 22px rgba(0,0,0,.3)}.card-back.selected-b{border-color:var(--red);box-shadow:0 0 0 3px rgba(214,107,143,.25),0 10px 22px rgba(0,0,0,.3)}.badge{position:absolute;top:5px;left:5px;border-radius:999px;padding:2px 6px;font-size:11px;font-weight:900;color:#140f1a;z-index:2}.selected-a .badge{background:var(--green)}.selected-b .badge{background:var(--red)}.mini-icon{font-size:27px;line-height:1}.mini-name{font-size:11px;font-weight:900;line-height:1.2;margin-top:4px}.mini-ori{font-size:10px;font-weight:900;color:#4c365e;margin-top:3px}.chosen-card{margin:0 auto 18px;width:190px;min-height:285px;border-radius:18px;background:linear-gradient(145deg,#241a3e,#6a4c89);border:2px solid #d6b45f;display:grid;place-items:center;box-shadow:0 12px 34px rgba(0,0,0,.48);padding:18px;text-align:center}.chosen-card .big{font-size:28px;line-height:1.5}.reading{background:rgba(20,15,26,.76);border:1px solid rgba(216,180,95,.23);border-radius:18px;padding:16px;line-height:1.85;font-size:15px}.reading h2{margin:0 0 8px;font-size:20px;color:#ffecb0}.reading h3{margin:18px 0 4px;color:#fff6d8;font-size:16px}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.verdict,.summary{background:rgba(216,180,95,.12);border:1px solid rgba(216,180,95,.28);border-radius:18px;padding:16px;margin-top:14px;line-height:1.85}.counter{text-align:center;color:#fde68a;font-size:13px;margin:8px 0}.spread-wrap{overflow:auto;padding:8px 0}.spread{position:relative;width:min(94vw,560px);height:min(94vw,560px);max-width:560px;max-height:560px;margin:0 auto}.slot{position:absolute;width:74px;min-height:112px;border-radius:13px;background:#ffffff12;border:1px solid #ffffff26;text-align:center;padding:6px;transform:translate(-50%,-50%);box-shadow:0 12px 20px #0007}.slot.center{width:94px;min-height:132px;background:#fef3c7;color:#111827;border:2px solid #facc15}.slot-card{height:78px;border-radius:9px;background:linear-gradient(160deg,#fef3c7,#8b5cf6 58%,#111827);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#111827;font-weight:900;border:1px solid #ffffff88;margin-bottom:5px;position:relative;overflow:hidden}.slot-card.rev{transform:rotate(180deg)}.slot-card .sym{font-size:24px;line-height:1}.slot-card .mini{font-size:10px;line-height:1.1;margin-top:4px;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot.center .slot-card{height:92px}.slot-label{font-size:10px;color:#c7d2fe;line-height:1.2}.center .slot-label{color:#6b21a8}.slot-name{font-size:11px;font-weight:800;line-height:1.2}.slot-pos{font-size:10px;color:#fde68a}.center .slot-pos{color:#92400e}.reading-item{background:#ffffff10;border:1px solid #ffffff20;border-radius:16px;padding:13px;margin:10px 0;line-height:1.7}.tag{display:inline-block;font-size:12px;color:#111827;background:#fef3c7;border-radius:999px;padding:2px 8px;margin:0 6px 6px 0}
@media(max-width:780px){.home-grid,.row,.status,.result-grid{grid-template-columns:1fr}.deck{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}.card-back{height:104px}.topbar{align-items:flex-start;flex-direction:column}.button-row{justify-content:flex-start}}
@media(max-width:430px){body{padding-left:10px;padding-right:10px}h1{font-size:24px}.slot{width:60px;min-height:98px;padding:5px}.slot.center{width:78px;min-height:116px}.slot-card{height:66px}.slot.center .slot-card{height:78px}.slot-card .mini{font-size:9px;max-width:50px}.slot-label{font-size:9px}.slot-name{font-size:10px}}

.copy-status{display:none;color:#f6e8b8;margin-top:10px;font-size:14px;text-align:center}
.notice{background:rgba(216,180,95,.12);border:1px solid rgba(216,180,95,.28);border-radius:16px;padding:13px;line-height:1.75;color:#f6e8b8;margin:12px 0}
.locked-note{color:#f6e8b8;text-align:center;font-size:14px;line-height:1.7}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="kicker">TAROT READING APP</div>
  <h1>統合タロット占いアプリ</h1>
  <p class="lead">最初に占いの種類を選び、先にカードを確定してから占いたい内容を書けます。ワンオラクル、二者択一、ホロスコープスプレッドを1つにまとめています。</p>
</header>

<section id="home" class="panel">
  <div class="home-grid">
    <button class="home-card" onclick="showMode('one')"><div class="icon">🔮</div><h2>ワンオラクル</h2><p>1枚のカードで、今のテーマ・流れ・注意点を長文で読みます。</p></button>
    <button class="home-card" onclick="showMode('two')"><div class="icon">⚖️</div><h2>二者択一</h2><p>AとBの選択肢に1枚ずつカードを引き、どちらが良い流れか比較します。</p></button>
    <button class="home-card" onclick="showMode('horo')"><div class="icon">🌙</div><h2>ホロスコープ</h2><p>12枚を円形、中央に1枚。12ヶ月または12ハウスの流れを読みます。</p></button>
    <button class="home-card" onclick="showMode('celtic')"><div class="icon">✠</div><h2>ケルト十字</h2><p>10枚で現在・障害・近未来・本心・結果まで詳しく読み解きます。</p></button>
  </div>
</section>

<section id="one" class="hidden"></section>
<section id="two" class="hidden"></section>
<section id="horo" class="hidden"></section>
<section id="celtic" class="hidden"></section>
</div>
<script>
const TAROT=[
{n:"愚者",s:"🃏",cat:"start",u:"新しい始まり、自由、未知への一歩。まだ形は固まっていませんが、可能性は大きく広がっています。",r:"準備不足、軽率さ、見通しの甘さ。勢いだけで進むと、後から調整が必要になります。",advU:"完璧を待つより、まず小さく試すことが運を開きます。",advR:"今は勢いより確認です。条件、期限、相手の反応を一度整理してください。"},
{n:"魔術師",s:"✴",cat:"action",u:"行動力、創造力、実現力。必要な材料や能力はすでに揃いつつあります。",r:"力をうまく使えていない状態。準備不足、説明不足、または空回りに注意です。",advU:"自分から提案し、主導権を取ると流れが良くなります。",advR:"道具や情報を揃えてから動くと、空回りを防げます。"},
{n:"女教皇",s:"☾",cat:"mind",u:"直感、知性、静かな判断。表に出ている情報より、違和感や予感が大切です。",r:"考えすぎ、不安、情報不足。直感と不安が混ざり、判断が曇りやすいです。",advU:"すぐ結論を出さず、観察と情報収集を優先してください。",advR:"思い込みで判断せず、事実確認を増やしてください。"},
{n:"女帝",s:"🌿",cat:"growth",u:"豊かさ、成長、魅力。手をかけたものが育ち、印象も良くなりやすいです。",r:"甘え、停滞、過剰な期待。良い素材はありますが、放置すると伸びきりません。",advU:"見た目や雰囲気を整えるほど、成果に結びつきます。",advR:"甘く見ている部分に手を入れると一気に改善します。"},
{n:"皇帝",s:"♜",cat:"stable",u:"安定、責任、現実的な勝ち筋。軸を決めるほど強くなります。",r:"頑固、圧力、柔軟性不足。正しさを押し通すほど反発を招きやすいです。",advU:"基準や条件を明確にして、ぶれずに進めてください。",advR:"譲れる点と譲れない点を分けると、衝突を減らせます。"},
{n:"教皇",s:"♙",cat:"trust",u:"信頼、助言、正攻法。経験者や専門家の意見が助けになります。",r:"形式への縛り、古いやり方への違和感。常識に寄せすぎると本質を見失います。",advU:"信頼できる人に相談し、標準的な手順を踏むと安全です。",advR:"一般論を鵜呑みにせず、自分の状況に合うか確認してください。"},
{n:"恋人",s:"♡",cat:"choice",u:"選択、調和、納得感。気持ちと条件が噛み合うと良い流れになります。",r:"迷い、不一致、優柔不断。気持ちと条件が噛み合っていない可能性があります。",advU:"損得だけでなく、納得できるかを基準にしてください。",advR:"選択肢を減らし、最も大事な条件を一つ決めてください。"},
{n:"戦車",s:"⚔",cat:"move",u:"前進、勝負、突破力。勢いを使って状況を押し出せる時です。",r:"焦り、暴走、方向違い。急ぎすぎると本来の目的から外れます。",advU:"短期決戦で動くと成果が出やすいです。",advR:"一度ブレーキを踏み、勝ち筋を確認してから動いてください。"},
{n:"力",s:"♌",cat:"patience",u:"粘り、信頼、内面の強さ。強引さよりも丁寧な対応が効きます。",r:"自信不足、消耗、不安。内側の疲れが判断に影響しやすいです。",advU:"相手や状況をねじ伏せず、時間をかけて慣らしてください。",advR:"無理に耐え続けず、休む・助けを借りる判断も必要です。"},
{n:"隠者",s:"☌",cat:"analysis",u:"熟考、専門性、静かな答え。深く調べるほど正しい道が見えます。",r:"孤立、考えすぎ、遅れ。検討ばかりで動きが止まりやすいです。",advU:"データや過去の事例を見直すと、正しい判断に近づきます。",advR:"考える期限を決め、外の意見も入れてください。"},
{n:"運命の輪",s:"◎",cat:"change",u:"転機、好機、タイミング。予想外のきっかけで状況が動きます。",r:"タイミング違い、停滞、予測不能。今は無理に押すほど噛み合いません。",advU:"チャンスが来たら素早く反応してください。",advR:"今動かないなら、次の波に備える準備へ切り替えてください。"},
{n:"正義",s:"⚖",cat:"judge",u:"公平、契約、妥当な判断。数字や条件を冷静に比べるほど答えに近づきます。",r:"不均衡、条件の見落とし、判断ミス。感情や先入観で結論を出しやすいです。",advU:"条件を紙に書き出し、客観的に比較してください。",advR:"契約、金額、期限、約束事は特に慎重に確認してください。"},
{n:"吊るされた男",s:"☍",cat:"wait",u:"待つ価値、視点転換、忍耐。すぐ動かないことで見えてくるものがあります。",r:"報われにくい我慢、停滞、犠牲感。待つ理由が曖昧なら見直しが必要です。",advU:"今は視点を変え、別角度から打開策を探してください。",advR:"ただ耐えるだけになっていないか確認してください。"},
{n:"死神",s:"♱",cat:"end",u:"区切り、変化、再出発。古い形を終えることで新しい流れが始まります。",r:"未練、変化への抵抗、先延ばし。終わらせるべきものを引きずっています。",advU:"不要な条件や古い方針を思い切って手放してください。",advR:"先延ばししている決断を一つだけでも片付けてください。"},
{n:"節制",s:"♒",cat:"balance",u:"調整、バランス、穏やかな改善。無理なく整えることで安定します。",r:"中途半端、不調和、ペースの乱れ。調整不足が表に出ています。",advU:"急変より微調整が効果的です。",advR:"生活、予算、時間配分のどこかを整える必要があります。"},
{n:"悪魔",s:"♑",cat:"bind",u:"執着、誘惑、魅力ある罠。強く惹かれる分、隠れたコストもあります。",r:"依存からの解放、悪循環の断ち切り。しがらみを断つチャンスです。",advU:"欲や不安で判断していないか見直してください。",advR:"手放すほど身軽になり、判断がクリアになります。"},
{n:"塔",s:"⚡",cat:"shock",u:"急変、破壊、想定外。前提が崩れることで再構築が必要になります。",r:"崩壊回避、小さな崩れ、警告。大崩れ前に修正できる段階です。",advU:"壊れたものを守るより、作り直す判断が必要です。",advR:"小さな違和感のうちに修正してください。"},
{n:"星",s:"✧",cat:"hope",u:"希望、回復、未来の可能性。すぐ完成しなくても良い方向へ向かいます。",r:"期待先行、現実感不足、不安。理想と現実の距離が気になりやすいです。",advU:"長期目標を信じて、焦らず育ててください。",advR:"理想を少し具体的な行動に落とし込んでください。"},
{n:"月",s:"☽",cat:"unclear",u:"不安、曖昧さ、見えない要素。情報が不完全で思い込みが強くなりやすい時です。",r:"誤解が晴れる、真実が見える。少しずつ状況の正体が見え始めています。",advU:"不確かな情報で大きな決断をしないでください。",advR:"見えてきた事実をもとに、判断を更新してください。"},
{n:"太陽",s:"☀",cat:"success",u:"成功、明るい結果、満足。評価や協力も得やすい前向きなカードです。",r:"成功はあるが遅い、詰めの甘さ、過信。悪くはありませんが油断は禁物です。",advU:"堂々と見せることで評価されます。",advR:"最後の確認と細部の調整を怠らないでください。"},
{n:"審判",s:"✺",cat:"call",u:"再評価、復活、決断の時。過去の積み重ねが次の判断につながります。",r:"決断遅れ、過去への未練、チャンスを逃す不安。答えを先送りしがちです。",advU:"返事、申請、相談など、呼びかける行動が効果的です。",advR:"過去の失敗から学び、同じ形を繰り返さないでください。"},
{n:"世界",s:"◉",cat:"complete",u:"完成、達成、最良の着地。物事がまとまり、満足できる結果へ向かいます。",r:"あと一歩、未完成、詰め不足。仕上げの調整が必要です。",advU:"最後まで仕上げることで評価が確定します。",advR:"終わらせるための具体的なチェックリストを作ってください。"}
];
const monthNames=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const houseNames=["第1ハウス：自分・第一印象","第2ハウス：お金・所有","第3ハウス：情報・学習・近場","第4ハウス：家・基盤","第5ハウス：楽しみ・創作・恋愛","第6ハウス：仕事習慣・健康","第7ハウス：対人・契約","第8ハウス：共有財産・深い関係","第9ハウス：遠方・学び・思想","第10ハウス：仕事・社会的評価","第11ハウス：仲間・未来計画","第12ハウス：潜在意識・整理"];
function esc(s){return String(s||"").replace(/[&<>'"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[m]))}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function drawnDeck(){return shuffle(TAROT).map((c,i)=>({...c,id:i,rev:Math.random()<0.45}))}
function cardHTML(c,badgeClass='',badge=''){return `<div class="front">${badge?`<span class="badge">${badge}</span>`:''}<div class="mini-icon">${c.s}</div><div class="mini-name">${c.n}</div><div class="mini-ori">${c.rev?'逆位置':'正位置'}</div></div>`}
function textOf(c){return c.rev?c.r:c.u}function advOf(c){return c.rev?c.advR:c.advU}

function showMode(m){['home','one','two','horo','celtic'].forEach(id=>document.getElementById(id).classList.add('hidden'));document.getElementById(m).classList.remove('hidden'); if(m==='one') initOne(); if(m==='two') initTwo(); if(m==='horo') initHoro(); if(m==='celtic') initCeltic(); window.scrollTo({top:0,behavior:'smooth'});}
function backHome(){['one','two','horo'].forEach(id=>document.getElementById(id).classList.add('hidden'));document.getElementById('home').classList.remove('hidden');}

function longOneReading(q,c){
  const pos=c.rev?'逆位置':'正位置';
  const flow=textOf(c);
  const advice=advOf(c);
  const reverse=c.rev;
  return `<h2>選ばれたカード：${c.n}（${pos}）</h2>
  <h3>結論</h3><p>${esc(q)}については、「${flow}」という流れが出ています。${reverse?'これは単純な否定ではなく、条件整理やタイミング調整が必要というサインです。':'今の方向性には前向きな可能性があり、丁寧に進めることで結果につながりやすい状態です。'}</p>
  <h3>深掘り解釈</h3><p>このカードは、表面的な結果だけでなく、今のあなたの心理状態や現実の流れも示しています。期待している部分と不安な部分を分けて見ることで、判断がかなりクリアになります。カードの意味をそのまま未来予言として受け取るより、「今どこを整えるべきか」という実践的なヒントとして読むのが良いです。</p>
  <h3>注意点</h3><p>${reverse?'焦りや不安から急に結論を出すと、あとで修正が必要になりやすいです。数字、期限、相手の反応、現実的な条件を一度分けて確認してください。':'良い流れが出ていても、油断すると細部を見落とします。勢いだけで進めず、確認すべき条件を押さえながら動くことが大切です。'}</p>
  <h3>具体的な行動アドバイス</h3><p>${advice} 今回は、全部を一気に変えるよりも、小さく試して反応を見るのが合っています。必要なら修正しながら進めることで、このカードの良い面を引き出しやすくなります。</p>
  <h3>最終メッセージ</h3><p>${reverse?'今は「整えてから進む」が合っています。悪い結果と決めつけず、弱点を潰せば流れは変えられます。':'今の流れには可能性があります。直感を信じつつ、現実の確認を重ねることで安定した判断になります。'}</p>`;
}

function makeDeepPrompt(kind, body){
  return `以下はタロット占いアプリで出た結果です。
この内容をもとに、かなり詳しく、現実的な行動アドバイスまで含めて日本語で深掘り解説してください。

【占いの種類】
${kind}

${body}

【解説してほしいこと】
・全体の結論
・カードごとの意味
・正位置/逆位置を踏まえた注意点
・質問内容に対してどう読めるか
・現実的にどう行動すべきか
・避けた方がいい判断
・最後に短くまとめたアドバイス`;
}
async function copyText(text,statusId){
  const status=document.getElementById(statusId);
  try{await navigator.clipboard.writeText(text)}
  catch(e){const area=document.createElement('textarea');area.value=text;document.body.appendChild(area);area.select();document.execCommand('copy');document.body.removeChild(area)}
  if(status){status.style.display='block';status.textContent='コピーしました。ChatGPTに貼り付けて深掘りできます。'}
}

let twoState;
function initTwo(){
  twoState={deck:drawnDeck(),mode:'A',A:null,B:null,q:'',la:'',lb:''};
  document.getElementById('two').innerHTML=`<div class="topbar"><h2>⚖️ 二者択一</h2><button class="ghost" onclick="backHome()">占い選択に戻る</button></div>
  <section class="panel"><div class="notice">質問文とA/Bの内容はまだ書きません。心の中でAとBを決めて、先にAのカード・Bのカードを選んでください。</div><div class="status"><div class="status-box"><strong>A：</strong><span id="statusA">まだ選ばれていません</span></div><div class="status-box"><strong>B：</strong><span id="statusB">まだ選ばれていません</span></div></div></section>
  <section class="panel"><div class="section-title">カードを選ぶ</div><p class="small" style="text-align:center">現在の選択モード：<strong id="modeText">Aのカードを選ぶ</strong></p><div class="mode"><button id="modeA" class="active" onclick="setTwoMode('A')">Aを選ぶ</button><button id="modeB" onclick="setTwoMode('B')">Bを選ぶ</button></div><div id="twoDeck" class="deck"></div></section>
  <section id="twoQuestion" class="panel hidden"><div class="locked-note">A/Bのカードは確定しました。</div><label>占いたい内容</label><textarea id="twoQ" placeholder="例：今の価格で様子を見るか、価格改定するかで迷っている"></textarea><div class="row" style="margin-top:14px"><div><label>Aの選択肢</label><input id="choiceA" placeholder="例：今の価格で様子を見る"></div><div><label>Bの選択肢</label><input id="choiceB" placeholder="例：価格を少し下げる"></div></div><div class="button-row"><button onclick="renderTwoResult()">この内容でリーディングする</button></div></section>
  <section id="twoResult" class="panel hidden"></section>`;
  renderTwoDeck();
}
function setTwoMode(m){twoState.mode=m;document.getElementById('modeA').classList.toggle('active',m==='A');document.getElementById('modeB').classList.toggle('active',m==='B');document.getElementById('modeText').textContent=m+'のカードを選ぶ'}
function renderTwoDeck(){const el=document.getElementById('twoDeck');el.innerHTML='';twoState.deck.forEach(c=>{const b=document.createElement('button');b.className='card-back';if(c.by){b.classList.add('revealed','used',c.by==='A'?'selected-a':'selected-b');b.innerHTML=cardHTML(c,'',c.by)}b.onclick=()=>pickTwo(c);el.appendChild(b);});}
function pickTwo(c){
  const m=twoState.mode;
  if(twoState[m]){alert(m+'のカードはすでに選ばれています。');return}
  c.by=m;twoState[m]=c;
  document.getElementById('status'+m).textContent=`${c.n}（${c.rev?'逆位置':'正位置'}）`;
  if(m==='A'&&!twoState.B)setTwoMode('B');else if(m==='B'&&!twoState.A)setTwoMode('A');
  renderTwoDeck();
  if(twoState.A&&twoState.B){
    document.getElementById('twoQuestion').classList.remove('hidden');
    document.getElementById('twoDeck').style.opacity='.35';
    document.querySelectorAll('#twoDeck .card-back').forEach(x=>x.disabled=true);
    setTimeout(()=>document.getElementById('twoQ').focus(),50);
  }
}
function sideReading(side,label,c){return `<h2>${side}：${esc(label)}</h2><p><strong>カード：</strong>${c.n}（${c.rev?'逆位置':'正位置'}）</p><h3>基本の流れ</h3><p>${esc(label)}には「${textOf(c)}」というテーマが出ています。これは単純な良し悪しではなく、この選択肢を選んだ時に何が起こりやすく、どこを整えれば結果が安定するかを示しています。</p><h3>メリット</h3><p>この選択肢の良さは、今の状況を動かすきっかけを作れる点です。正位置なら比較的スムーズに力が出やすく、逆位置なら課題に気づくことで修正の余地が生まれます。</p><h3>注意点</h3><p>目先の印象だけで判断すると、後から負担になる条件を見落としやすくなります。勢い、期待、不安のどれかに偏っていないかを確認してください。</p><h3>アドバイス</h3><p>${advOf(c)}</p>`}
function renderTwoResult(){
  const q=document.getElementById('twoQ').value.trim()||'心の中で思っていた二者択一の内容';
  const la=document.getElementById('choiceA').value.trim()||'Aの選択肢';
  const lb=document.getElementById('choiceB').value.trim()||'Bの選択肢';
  Object.assign(twoState,{q,la,lb});
  const a=twoState.A,b=twoState.B;
  let verdict='';
  const score=c=>(c.rev?0:2)+({success:3,complete:3,stable:2,balance:2,action:2,growth:2,hope:2,trust:1,judge:1,change:1,move:1,start:1,choice:1,patience:1,analysis:0,mind:0,wait:-1,unclear:-1,bind:-2,shock:-2,end:0,call:1}[c.cat]||0);
  if(score(a)>score(b))verdict=`総合的には、今はA「${esc(la)}」の方が流れに乗りやすい印象です。ただしBにも意味がないわけではなく、Bのカードが示す課題を整理してからなら再検討できます。`;
  else if(score(b)>score(a))verdict=`総合的には、今はB「${esc(lb)}」の方が現実を動かしやすい印象です。Aを選ぶ場合は、Aのカードが示す停滞や注意点を先に潰すことが大切です。`;
  else verdict=`AとBはかなり拮抗しています。今回はカードの強弱より、「どちらの注意点を自分が受け入れられるか」で決めると納得感が出やすいです。`;
  document.getElementById('twoResult').classList.remove('hidden');
  document.getElementById('twoResult').innerHTML=`<div class="result-grid"><div class="reading">${sideReading('A',la,a)}</div><div class="reading">${sideReading('B',lb,b)}</div></div><div class="verdict"><h2>総合判断</h2><p>占いたい内容：${esc(q)}</p><p>${verdict}</p><p>最終的には、カードの結果を現実の条件と合わせて見るのが安全です。金額、期限、相手の反応、リスク許容度を並べると、どちらを選ぶべきかがよりはっきりします。</p></div><div class="button-row"><button onclick="copyText(makeDeepPrompt('二者択一', twoCopyBody()), 'twoCopyStatus')">GPT深掘り用コピー</button><button onclick="initTwo()">リセットして占い直す</button></div><div id="twoCopyStatus" class="copy-status"></div>`;
}
function twoCopyBody(){
  return `【占いたい内容】\n${twoState.q}\n\n【Aの選択肢】\n${twoState.la}\n【Aのカード】\n${twoState.A.n}（${twoState.A.rev?'逆位置':'正位置'}）\n\n【Bの選択肢】\n${twoState.lb}\n【Bのカード】\n${twoState.B.n}（${twoState.B.rev?'逆位置':'正位置'}）`;
}

let horoDeck=[],horoSelected=[],horoQuestion='';
function initHoro(){

  document.getElementById('horo').innerHTML=`<div class="topbar"><h2>🌙 ホロスコープスプレッド</h2><button class="ghost" onclick="backHome()">占い選択に戻る</button></div>
  <section class="panel"><div class="notice">質問はまだ書きません。心の中でテーマを決めて、まず13枚のカードを選んでください。1〜12枚目が円形、13枚目が中央の結果カードになります。</div><div class="row" style="margin-top:10px"><div><label>読み方</label><select id="horoMode"><option value="months">12ヶ月の流れとして読む</option><option value="houses">12ハウスとして読む</option></select></div><div><label>開始月</label><select id="startMonth"></select></div></div><div class="button-row"><button onclick="prepareHoro()">カードをシャッフル</button><button class="secondary" onclick="initHoro()">リセットして占い直す</button></div><div id="horoStatus" class="small" style="margin-top:10px">まず「カードをシャッフル」を押してください。</div></section>

  const sel=document.getElementById('startMonth');const now=new Date();monthNames.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=m+'から開始';if(i===now.getMonth())o.selected=true;sel.appendChild(o)});

function prepareHoro(){horoDeck=drawnDeck();horoSelected=[];document.getElementById('horoDeckPanel').classList.remove('hidden');document.getElementById('spreadPanel').classList.add('hidden');document.getElementById('readingPanel').classList.add('hidden');document.getElementById('horoQuestion').classList.add('hidden');document.getElementById('horoStatus').textContent='カードを13枚選んでください。';renderHoroDeck();}
function renderHoroDeck(){
  const el=document.getElementById('horoDeck');el.innerHTML='';
  horoDeck.forEach(c=>{const b=document.createElement('button');b.className='card-back'+(horoSelected.includes(c)?' used':'');b.disabled=horoSelected.includes(c)||horoSelected.length>=13;b.onclick=()=>{horoSelected.push(c);renderHoroDeck();document.getElementById('horoStatus').textContent=horoSelected.length<13?`${13-horoSelected.length}枚選んでください。`:'13枚選び終わりました。占いたい内容を書いてください。';if(horoSelected.length===13){document.getElementById('horoQuestion').classList.remove('hidden');document.getElementById('horoDeck').style.opacity='.35';setTimeout(()=>document.getElementById('horoQ').focus(),50);}};el.appendChild(b);});
  document.getElementById('horoCounter').textContent=horoSelected.length+' / 13';
}
function labels(){if(document.getElementById('horoMode').value==='houses')return houseNames;const start=Number(document.getElementById('startMonth').value);return Array.from({length:12},(_,i)=>monthNames[(start+i)%12]);}
function renderHoroAll(){horoQuestion=document.getElementById('horoQ').value.trim()||'心の中で思っていた内容';renderSpread();renderHoroReading();}
function renderSpread(){document.getElementById('spreadPanel').classList.remove('hidden');const sp=document.getElementById('spread');sp.innerHTML='';const labs=labels();const w=sp.clientWidth||560,h=sp.clientHeight||560,cx=w/2,cy=h/2,r=w*.41;for(let i=0;i<12;i++){const ang=(-90+i*30)*Math.PI/180;sp.appendChild(slot(horoSelected[i],labs[i],cx+Math.cos(ang)*r,cy+Math.sin(ang)*r,false));}sp.appendChild(slot(horoSelected[12],'中央：総合結果',cx,cy,true));}
function slot(c,label,x,y,center){const d=document.createElement('div');d.className='slot'+(center?' center':'');d.style.left=x+'px';d.style.top=y+'px';d.innerHTML=`<div class="slot-card ${c.rev?'rev':''}"><div class="sym">${c.s}</div><div class="mini">${c.n}</div></div><div class="slot-label">${esc(label)}</div><div class="slot-name">${c.n}</div><div class="slot-pos">${c.rev?'逆位置':'正位置'}</div>`;return d;}
function renderHoroReading(){const q=horoQuestion;const center=horoSelected[12];const labs=labels();document.getElementById('readingPanel').classList.remove('hidden');document.getElementById('summary').innerHTML=`<h2>総合結果：${center.n}（${center.rev?'逆位置':'正位置'}）</h2><p>占いたい内容：${esc(q)}</p><p>全体テーマは「${textOf(center)}」です。</p><p>${advOf(center)} 12枚の流れは、この中央カードをどう現実に落とし込むかを示しています。</p>`;document.getElementById('horoReading').innerHTML='<h2>各カードの読み</h2>'+horoSelected.slice(0,12).map((c,i)=>`<div class="reading-item"><h3>${esc(labs[i])}：${c.n}（${c.rev?'逆位置':'正位置'}）</h3><span class="tag">${c.cat}</span><p>${textOf(c)}</p><p class="small"><strong>アドバイス：</strong>${advOf(c)}</p></div>`).join('');}
function horoCopyBody(){
  const labs=labels();
  const lines=[`【占いたい内容】\n${horoQuestion}`,`\n【中央：総合結果】\n${horoSelected[12].n}（${horoSelected[12].rev?'逆位置':'正位置'}）`,'\n【12枚の展開】'];
  horoSelected.slice(0,12).forEach((c,i)=>lines.push(`${labs[i]}：${c.n}（${c.rev?'逆位置':'正位置'}）`));
  return lines.join('\n');
}

    b.className='card-back'+(celticSelected.includes(c)?' used':'');
    b.disabled=celticSelected.includes(c)||celticSelected.length>=10;
    b.onclick=()=>{
      celticSelected.push(c);
      renderCelticDeck();
      document.getElementById('celticCounter').textContent=celticSelected.length+' / 10';
      if(celticSelected.length<10){
        document.getElementById('celticStatus').textContent=`${10-celticSelected.length}枚選んでください。`;
      }else{
        document.getElementById('celticStatus').textContent='10枚選び終わりました。占いたい内容を書いてください。';
        document.getElementById('celticQuestion').classList.remove('hidden');
        document.getElementById('celticDeck').style.opacity='.35';
        setTimeout(()=>document.getElementById('celticQ').focus(),50);
      }
    };
    el.appendChild(b);
  });
  document.getElementById('celticCounter').textContent=celticSelected.length+' / 10';
}

function renderCeltic(){
  celticQuestion=document.getElementById('celticQ').value.trim()||'心の中で思っていた内容';

  const result=document.getElementById('celticResult');
  result.classList.remove('hidden');

  const items=celticSelected.map((c,i)=>`
    <div class="reading-item">
      <h3>${i+1}. ${celticLabels[i]}：${c.n}（${c.rev?'逆位置':'正位置'}）</h3>
      <p>${textOf(c)}</p>
      <p class="small"><strong>アドバイス：</strong>${advOf(c)}</p>
    </div>
  `).join('');

  const finalCard=celticSelected[9];

  result.innerHTML=`
    <div class="summary">
      <h2>総合結果：${finalCard.n}（${finalCard.rev?'逆位置':'正位置'}）</h2>
      <p><strong>占いたい内容：</strong>${esc(celticQuestion)}</p>
      <p>今回のケルト十字では「${textOf(finalCard)}」が最終テーマとして出ています。</p>
      <p>${advOf(finalCard)}</p>
    </div>

    <div class="reading">
      <h2>10枚の展開</h2>
      ${items}

      <h2>総合リーディング</h2>
      <p>
      ケルト十字全体を見ると、現在の状況だけでなく、あなたの内面・周囲の状況・近未来・最終的な着地までが段階的に表れています。
      特に最終結果カードは「今の流れのまま進んだ場合どうなりやすいか」を示しており、途中のカードはその結果を良くするためのヒントになります。
      </p>

      <p>
      今回は、カードを見てから質問を書いているため、質問内容に合わせてカードが選ばれている感覚をかなり減らしています。
      そのうえで、出たカードをどう現実に活かすかが重要になります。
      </p>
    </div>

    <div class="button-row">
      <button onclick="copyText(makeDeepPrompt('ケルト十字', celticCopyBody()), 'celticCopyStatus')">GPT深掘り用コピー</button>
      <button onclick="initCeltic()">リセットして占い直す</button>
    </div>

    <div id="celticCopyStatus" class="copy-status"></div>
  `;
}

function celticCopyBody(){
  const lines=[`【占いたい内容】\n${celticQuestion}`,'\n【10枚の展開】'];
  celticSelected.forEach((c,i)=>{
    lines.push(`${i+1}. ${celticLabels[i]}：${c.n}（${c.rev?'逆位置':'正位置'}）`);
  });
  return lines.join('\n');
}

</script>
</body>
