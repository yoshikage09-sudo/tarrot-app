<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>フクロウ耳羽モーション確認</title>
<style>
:root{color-scheme:dark;--gold:#dec176}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#050a13;color:#f8efd8;font-family:"Yu Mincho",serif}
main{width:min(100%,480px);padding:24px 18px;text-align:center}
h1{margin:0 0 8px;font-size:22px;font-weight:400}.note{margin:0 0 18px;color:#c7bdac;font:12px/1.8 sans-serif}
.stage{position:relative;width:min(100%,380px);aspect-ratio:380/390;margin:auto;overflow:hidden;border-radius:12px;box-shadow:0 18px 50px #000a}
.base,.ear{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ear{will-change:transform}
.ear-left{transform-origin:37% 29%;clip-path:polygon(11% 0,49% 0,54% 34%,37% 39%,10% 25%)}
.ear-right{transform-origin:68% 43%;clip-path:polygon(61% 19%,96% 19%,98% 49%,75% 51%,60% 39%)}
.stage.play .ear-left{animation:leftEarTwitch .72s cubic-bezier(.4,0,.2,1)}
.stage.play .ear-right{animation:rightEarTwitch .72s cubic-bezier(.4,0,.2,1) .09s}
@keyframes leftEarTwitch{0%,100%{transform:rotate(0)}22%{transform:rotate(-1.35deg)}43%{transform:rotate(.7deg)}64%{transform:rotate(-.55deg)}82%{transform:rotate(.2deg)}}
@keyframes rightEarTwitch{0%,100%{transform:rotate(0)}22%{transform:rotate(1.2deg)}43%{transform:rotate(-.65deg)}64%{transform:rotate(.5deg)}82%{transform:rotate(-.18deg)}}
button{margin-top:20px;width:min(100%,340px);min-height:50px;border-radius:999px;border:1px solid #c6a75f;color:#fff2cd;background:linear-gradient(#27354a,#0e1727);font:16px inherit;cursor:pointer}
button:focus-visible{outline:2px solid #fff1b0;outline-offset:4px}
.status{min-height:22px;margin:12px 0 0;color:#cfbf98;font:12px sans-serif}
@media(prefers-reduced-motion:reduce){.ear{display:none}}
</style>
</head>
<body>
<main>
  <h1>耳羽の動き</h1>
  <p class="note">元画像は変えず、左右の耳先だけを小さく二度動かす確認用です。</p>
  <div class="stage" id="stage" role="img" aria-label="星のフクロウの耳羽モーション">
    <img class="base" src="assets/astral/owl-head-source-crop.png" alt="">
    <img class="ear ear-left" src="assets/astral/owl-head-source-crop.png" alt="">
    <img class="ear ear-right" src="assets/astral/owl-head-source-crop.png" alt="">
  </div>
  <button id="play" type="button">耳の動きを確認</button>
  <p class="status" id="status" aria-live="polite">ボタンを押すと一度動きます。</p>
</main>
<script>
const stage=document.getElementById('stage'),button=document.getElementById('play'),statusLine=document.getElementById('status');
function play(){stage.classList.remove('play');void stage.offsetWidth;stage.classList.add('play');button.disabled=true;statusLine.textContent='耳羽が反応しています…';setTimeout(()=>{stage.classList.remove('play');button.disabled=false;statusLine.textContent='もう一度確認できます。';},950)}
button.addEventListener('click',play);setTimeout(play,700);
</script>
</body>
</html>
